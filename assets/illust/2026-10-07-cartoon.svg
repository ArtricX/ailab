<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="로봇 팔이 그림 구석에 다른 작가의 서명을 써 넣고, 옆에서 사람이 놀라서 보는 그림">
  <rect width="800" height="600" fill="#FF8FC8"/>

  <!-- 이젤 -->
  <g stroke="#000" stroke-width="6" stroke-linecap="round">
    <line x1="260" y1="420" x2="210" y2="580"/>
    <line x1="500" y1="420" x2="550" y2="580"/>
    <line x1="380" y1="420" x2="380" y2="590"/>
  </g>

  <!-- 캔버스 -->
  <rect x="150" y="70" width="460" height="350" fill="#FFFFFF" stroke="#000" stroke-width="6"/>
  <!-- 캔버스 속 만화: 의자에 앉은 사람과 고양이 -->
  <g stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="300" cy="190" r="34" fill="#FFD21F"/>
    <path d="M288 186 h0 M314 186 h0" stroke-width="7"/>
    <path d="M290 206 q10 6 22 0"/>
    <path d="M300 224 L300 300 M270 250 L330 250 M300 300 L276 352 M300 300 L326 352"/>
    <path d="M240 300 h120 M250 300 v52 M350 300 v52"/>
    <path d="M420 330 q-6 -40 30 -44 q36 4 30 44 z" fill="#1F3DFF"/>
    <path d="M428 292 l-6 -20 l18 12 M472 292 l6 -20 l-18 12"/>
    <path d="M482 322 q34 -6 26 -40"/>
  </g>
  <rect x="380" y="110" width="140" height="56" rx="26" fill="#FFFFFF" stroke="#000" stroke-width="4"/>
  <text x="450" y="146" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="700" font-size="22" text-anchor="middle" fill="#000">야옹?</text>

  <!-- 서명 -->
  <text x="588" y="400" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="30" text-anchor="end" fill="#000">BLOPER</text>
  <ellipse cx="530" cy="390" rx="82" ry="26" fill="none" stroke="#FF3D14" stroke-width="6"/>
  <g stroke="#FF3D14" stroke-width="5" stroke-linecap="round">
    <line x1="618" y1="352" x2="634" y2="336"/>
    <line x1="626" y1="372" x2="648" y2="366"/>
  </g>

  <!-- 로봇 팔 -->
  <g stroke="#000" stroke-width="6" stroke-linejoin="round">
    <rect x="690" y="520" width="140" height="70" rx="10" fill="#1F3DFF"/>
    <path d="M730 530 L700 420 L736 410 L770 520 Z" fill="#FFFFFF"/>
    <circle cx="716" cy="414" r="22" fill="#FFD21F"/>
    <path d="M706 400 L612 420 L620 452 L716 432 Z" fill="#FFFFFF"/>
    <circle cx="616" cy="436" r="16" fill="#FFD21F"/>
  </g>
  <!-- 집게와 펜 -->
  <g stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M604 428 L586 414 M604 444 L584 452" fill="none"/>
    <g transform="rotate(36 572 430)">
      <rect x="540" y="422" width="78" height="18" rx="3" fill="#12A150"/>
      <path d="M540 422 L520 431 L540 440 Z" fill="#FFD21F"/>
    </g>
  </g>

  <!-- 놀란 작가 -->
  <g stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 600 q10 -110 70 -110 q60 0 70 110" fill="#12A150"/>
    <circle cx="110" cy="440" r="44" fill="#FFFFFF"/>
    <path d="M66 424 q44 -50 88 0 q-44 -22 -88 0z" fill="#FF3D14"/>
    <circle cx="96" cy="446" r="6" fill="#000"/>
    <circle cx="126" cy="446" r="6" fill="#000"/>
    <ellipse cx="111" cy="470" rx="8" ry="10" fill="#000"/>
  </g>
  <text x="44" y="360" font-family="Archivo, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="64" fill="#000">?!</text>
</svg>
