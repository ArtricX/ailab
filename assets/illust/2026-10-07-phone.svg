<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="거대한 데이터센터가 스마트폰에서 메모리 칩을 끌어가고, 폰에는 오른 가격표가 달려 있는 그림">
  <rect width="800" height="600" fill="#1F3DFF"/>
  <!-- 바닥 그림자 -->
  <ellipse cx="580" cy="540" rx="170" ry="22" fill="#0A1E9E"/>
  <ellipse cx="210" cy="548" rx="110" ry="16" fill="#0A1E9E"/>

  <!-- 칩이 날아가는 길 -->
  <path d="M220 225 C 260 70, 420 40, 488 150" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="4 14" stroke-linecap="round"/>

  <!-- 데이터센터 서버 -->
  <rect x="470" y="120" width="230" height="415" rx="10" fill="#FFD21F" stroke="#000" stroke-width="6"/>
  <rect x="470" y="120" width="230" height="40" rx="10" fill="#000"/>
  <circle cx="496" cy="140" r="7" fill="#FF3D14"/>
  <circle cx="518" cy="140" r="7" fill="#12A150"/>
  <g stroke="#000" stroke-width="4">
    <rect x="494" y="182" width="182" height="56" rx="4" fill="#FFFFFF"/>
    <rect x="494" y="254" width="182" height="56" rx="4" fill="#FFFFFF"/>
    <rect x="494" y="326" width="182" height="56" rx="4" fill="#FFFFFF"/>
    <rect x="494" y="398" width="182" height="56" rx="4" fill="#FFFFFF"/>
    <rect x="494" y="470" width="182" height="40" rx="4" fill="#FFFFFF"/>
  </g>
  <g stroke="#000" stroke-width="4" stroke-linecap="round">
    <line x1="512" y1="210" x2="600" y2="210"/>
    <line x1="512" y1="282" x2="580" y2="282"/>
    <line x1="512" y1="354" x2="610" y2="354"/>
    <line x1="512" y1="426" x2="570" y2="426"/>
  </g>
  <g>
    <circle cx="652" cy="210" r="9" fill="#12A150" stroke="#000" stroke-width="3"/>
    <circle cx="652" cy="282" r="9" fill="#FF3D14" stroke="#000" stroke-width="3"/>
    <circle cx="652" cy="354" r="9" fill="#12A150" stroke="#000" stroke-width="3"/>
    <circle cx="652" cy="426" r="9" fill="#12A150" stroke="#000" stroke-width="3"/>
  </g>
  <!-- 서버 입 (칩을 빨아들이는 구멍) -->
  <rect x="452" y="150" width="40" height="70" rx="8" fill="#000"/>

  <!-- 날아가는 메모리 칩 -->
  <g stroke="#000" stroke-width="4" stroke-linecap="round">
    <g transform="translate(250 130) rotate(-30)">
      <rect x="-28" y="-18" width="56" height="36" rx="4" fill="#12A150"/>
      <line x1="-18" y1="-18" x2="-18" y2="-28"/><line x1="0" y1="-18" x2="0" y2="-28"/><line x1="18" y1="-18" x2="18" y2="-28"/>
      <line x1="-18" y1="18" x2="-18" y2="28"/><line x1="0" y1="18" x2="0" y2="28"/><line x1="18" y1="18" x2="18" y2="28"/>
    </g>
    <g transform="translate(338 70) rotate(12)">
      <rect x="-28" y="-18" width="56" height="36" rx="4" fill="#12A150"/>
      <line x1="-18" y1="-18" x2="-18" y2="-28"/><line x1="0" y1="-18" x2="0" y2="-28"/><line x1="18" y1="-18" x2="18" y2="-28"/>
      <line x1="-18" y1="18" x2="-18" y2="28"/><line x1="0" y1="18" x2="0" y2="28"/><line x1="18" y1="18" x2="18" y2="28"/>
    </g>
    <g transform="translate(428 96) rotate(38)">
      <rect x="-28" y="-18" width="56" height="36" rx="4" fill="#12A150"/>
      <line x1="-18" y1="-18" x2="-18" y2="-28"/><line x1="0" y1="-18" x2="0" y2="-28"/><line x1="18" y1="-18" x2="18" y2="-28"/>
      <line x1="-18" y1="18" x2="-18" y2="28"/><line x1="0" y1="18" x2="0" y2="28"/><line x1="18" y1="18" x2="18" y2="28"/>
    </g>
  </g>

  <!-- 스마트폰 -->
  <g transform="rotate(-8 210 390)">
    <rect x="125" y="235" width="170" height="300" rx="28" fill="#FFFFFF" stroke="#000" stroke-width="6"/>
    <rect x="142" y="268" width="136" height="220" rx="10" fill="#FF8FC8" stroke="#000" stroke-width="4"/>
    <rect x="186" y="248" width="48" height="8" rx="4" fill="#000"/>
    <!-- 빈 칩 자리 -->
    <rect x="172" y="318" width="76" height="46" rx="6" fill="#FFFFFF" stroke="#000" stroke-width="4" stroke-dasharray="8 7"/>
    <!-- 시무룩한 얼굴 -->
    <circle cx="186" cy="410" r="7" fill="#000"/>
    <circle cx="234" cy="410" r="7" fill="#000"/>
    <path d="M186 452 Q210 432 234 452" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
    <circle cx="210" cy="512" r="9" fill="none" stroke="#000" stroke-width="4"/>
  </g>

  <!-- 가격표 -->
  <path d="M292 268 C 318 300, 318 318, 330 334" fill="none" stroke="#000" stroke-width="4"/>
  <g transform="rotate(14 370 380)">
    <path d="M318 334 L400 334 Q412 334 412 346 L412 426 Q412 438 400 438 L318 438 L292 386 Z" fill="#FFFFFF" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="312" cy="386" r="7" fill="#1F3DFF" stroke="#000" stroke-width="3"/>
    <text x="368" y="398" font-family="Archivo, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="34" text-anchor="middle" fill="#000">$120</text>
  </g>
  <!-- 오르는 화살표 -->
  <path d="M372 520 L372 470 M352 488 L372 466 L392 488" fill="none" stroke="#FF3D14" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 반짝임 -->
  <g fill="#FFFFFF">
    <path d="M90 110 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6z"/>
    <path d="M730 70 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z"/>
    <circle cx="120" cy="190" r="5"/>
    <circle cx="760" cy="300" r="5"/>
  </g>
</svg>
