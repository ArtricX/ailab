name: 사이트 배포 확인

# main에 글이 들어가면(PR 병합) 대표 주소에 오늘 글 데이터가 실제로 올라갔는지 확인해요.
# 메일(앱스 스크립트)은 https://aigo.artricx.com/content/날짜.json 이 있어야 나가요.
# 20분 안에 안 보이면: 실행이 '실패'로 끝나고(GitHub이 메일·앱 알림을 보내요) 저장소에 이슈를 하나 열어요.
# 2026-11-07처럼 배포가 멈춘 날을 바로 알아채려고 만들었어요(CLAUDE.md 10번).
on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "posts.json"
      - "content/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 대표 주소에 가장 최근 글 데이터가 올라왔는지 확인 (최대 20분)
        id: check
        run: |
          DATE=$(python3 -c "import json;print(json.load(open('posts.json'))[0]['date'])")
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          MAIN="https://aigo.artricx.com/content/$DATE.json"
          BACKUP="https://artricx.github.io/ailab/content/$DATE.json"
          echo "확인할 날짜: $DATE"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$MAIN?t=$(date +%s)")
            if [ "$code" = "200" ]; then
              echo "대표 주소 OK ($MAIN) — $((i*30))초 안에 확인"
              b=$(curl -s -o /dev/null -w "%{http_code}" "$BACKUP?t=$(date +%s)")
              echo "예비 주소(GitHub Pages): $b"
              [ "$b" = "200" ] || echo "::warning::예비 주소(GitHub Pages)에는 아직 없어요. 앱·메일은 대표 주소를 쓰니 급하지 않아요."
              exit 0
            fi
            echo "$((i*30))초: 아직 없음 (HTTP $code)"
            sleep 30
          done
          echo "::error::20분이 지나도 대표 주소에 $DATE 글 데이터가 없어요. 이대로면 메일이 나가지 않아요."
          exit 1

      - name: 실패하면 이슈 열기
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.check.outputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "[배포 확인 실패] $DATE 글이 사이트에 올라가지 않았어요" --body "$(cat <<BODY
          PR이 병합됐지만 20분이 지나도 https://aigo.artricx.com/content/$DATE.json 이 열리지 않아요.
          이 파일이 없으면 오전 7시 메일이 나가지 않아요.

          ## 확인할 곳
          - 이 확인 실행: $RUN_URL
          - Cloudflare Pages 대시보드의 ailab 배포 기록 (실패·멈춤 여부)
          - 저장소 Actions의 '그림·녹음 내려받기' 실행 (content 파일을 만드는 작업)

          ## 고치는 법 (CLAUDE.md 10번)
          - 같은 실행을 다시 실행하지 말고, 1~2시간 뒤 작은 새 커밋(PR)으로 다시 배포해요.
          - 낮 12시가 지나서 올라가면 메일이 자동으로 나가지 않으니, 앱스 스크립트에서 sendTodayNow를 실행해요.
          BODY
          )"
