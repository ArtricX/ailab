name: 그림·녹음 내려받기

# 글에 들어간 외부 그림과 녹음(힉스필드)을 사이트 안(assets/img/, assets/audio/)에 저장하고 주소를 바꿉니다.
on:
  push:
    paths:
      - "posts/**"
      - "posts.json"
      - "*.html"
      - "assets/style.css"
      - "assets/site.js"
      - "scripts/build.py"
      - "scripts/extract_content.py"
      - "scripts/migrate_design.py"
      - "scripts/render_glance.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 그림 도구 설치
        run: pip install pillow beautifulsoup4
      - name: 그림 내려받기
        run: python3 scripts/fetch_images.py
      - name: 예전 모양 글을 새 디자인 머리·끝으로 맞추기
        # 새 디자인(2026-11) 전 틀로 만든 글이 들어와도 상단 메뉴·받아 보기·바닥글을 맞춰요. 이미 맞는 글은 그대로 둬요.
        run: python3 scripts/migrate_design.py || echo "::warning::새 디자인으로 맞추지 못한 글이 있어요. 위 기록을 확인하세요."
      - name: 홈 화면 다시 만들기
        run: python3 scripts/build.py
      - name: 한눈에 보기 카드를 앱용 그림으로
        # 인포그래픽 카드(aside.glance)는 글로 된 칸이라 앱에는 카드를 찍은 그림(content/graphics/날짜-앵커.png)을 넣어요.
        # 새로 생겼거나 바뀐 카드만 찍어요. 실패해도 다음 단계는 계속해요(앱에서 그날 인포그래픽 칸만 빠져요).
        run: |
          if grep -lq 'class="glance"' posts/*.html; then
            pip install playwright && python -m playwright install --with-deps chromium
            python3 scripts/render_glance.py || echo "::warning::카드 그림을 만들지 못했어요. 앱에서 그날 인포그래픽이 빠져요. 위 기록을 확인하세요."
          else
            echo "카드가 있는 글 없음"
          fi
      - name: 앱용 데이터 만들기
        # 데이터 만들기가 실패해도 그림 저장은 막지 않아요. 실패하면 Actions 화면에 경고가 떠요.
        run: python3 scripts/extract_content.py || echo "::warning::앱용 데이터(content/)를 만들지 못한 글이 있어요. 위 기록을 확인하세요."
      - name: 바뀐 내용 저장
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ailab-bot"
            git config user.email "ailab-bot@users.noreply.github.com"
            git add assets/img assets/audio assets/og content posts posts.json index.html *.html templates
            git commit -m "그림·녹음을 사이트 안에 저장"
            git push
          else
            echo "바꿀 것 없음"
          fi
