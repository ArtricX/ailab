name: 그림 내려받기

# 글에 들어간 외부 그림(힉스필드)을 사이트 안(assets/img/)에 저장하고 주소를 바꿉니다.
on:
  push:
    paths:
      - "posts/**"
      - "posts.json"
      - "*.html"
      - "assets/style.css"
      - "assets/site.js"
      - "scripts/build.py"
      - "scripts/extract_content.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 그림 도구 설치
        run: pip install pillow beautifulsoup4
      - name: 그림 내려받기
        run: python3 scripts/fetch_images.py
      - name: 홈 화면 다시 만들기
        run: python3 scripts/build.py
      - name: 앱용 데이터 만들기
        # 데이터 만들기가 실패해도 그림 저장은 막지 않아요. 실패하면 Actions 화면에 경고가 떠요.
        run: python3 scripts/extract_content.py || echo "::warning::앱용 데이터(content/)를 만들지 못한 글이 있어요. 위 기록을 확인하세요."
      - name: 바뀐 내용 저장
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ailab-bot"
            git config user.email "ailab-bot@users.noreply.github.com"
            git add assets/img assets/og content posts posts.json index.html *.html templates
            git commit -m "그림을 사이트 안에 저장"
            git push
          else
            echo "바꿀 것 없음"
          fi
