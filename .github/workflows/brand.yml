name: 로고 파일 만들기

# assets/brand/sources.json(로고 원본 주소)이나 만드는 방법이 바뀌면 로고 파일을 다시 만들어 저장합니다.
on:
  push:
    paths:
      - "assets/brand/sources.json"
      - "scripts/make_brand.py"
      - ".github/workflows/brand.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brand-${{ github.ref }}
  cancel-in-progress: false

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 그림 도구 설치
        run: pip install pillow
      - name: 로고 파일 만들기
        run: python3 scripts/make_brand.py
      - name: 바뀐 내용 저장
        run: |
          if [ -n "$(git status --porcelain assets/brand)" ]; then
            git config user.name "ailab-bot"
            git config user.email "ailab-bot@users.noreply.github.com"
            git add assets/brand
            git commit -m "로고 파일 만들기"
            git push
          else
            echo "바꿀 것 없음"
          fi
