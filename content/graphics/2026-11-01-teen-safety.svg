<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g2t">챗GPT의 새 안전장치</title>
            <desc id="g2d">오픈AI는 10월 30일(미국 시간) 챗GPT의 새 안전장치를 밝혔다. 18살 아래 청소년에게는 질문에 나쁜 뜻이 없어 보여도 무기와 보안 장치에 대한 실제 정보를 덜 알려 준다. 모든 사람에게는 남을 해치는 이야기를 계속하면 대화를 끝낼 수 있고, 여러 번이면 계정을 잠시 멈출 수 있다. 청소년 계정이 멈추면 보호자에게 알릴 계획이다. 앞으로 몇 주 동안 차례로 적용된다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">18살</text>
            <text x="34" y="170" font-size="16" font-weight="800">아래 청소년은 무기 정보를 더 막아요</text>
            <text class="grey" x="34" y="194" font-size="13.5">오픈AI · 10월 30일 발표 (미국 시간)</text>

            <rect class="f-paper" x="34" y="222" width="320" height="48" rx="16"/>
            <text x="194" y="252" font-size="14.5" font-weight="900" text-anchor="middle">무기·보안 장치 정보를 덜 알려 줘요</text>
            <rect class="f-paper" x="34" y="280" width="320" height="48" rx="16"/>
            <text x="194" y="310" font-size="14.5" font-weight="900" text-anchor="middle">나쁜 뜻이 없어 보여도 막아요</text>
            <rect class="f-red" x="34" y="338" width="320" height="48" rx="16"/>
            <text class="white" x="194" y="368" font-size="14.5" font-weight="900" text-anchor="middle">몇 주 동안 차례로 바뀌어요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">모든 사람에게는 이렇게 돼요</text>
            <rect class="f-paper" x="440" y="74" width="320" height="48" rx="16"/>
            <text x="600" y="104" font-size="14.5" font-weight="900" text-anchor="middle">남을 해치는 이야기를 계속해요</text>
            <line class="line" x1="600" y1="126" x2="600" y2="136" stroke-width="3"/>
            <path class="f-ink" d="M600 146 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="150" width="320" height="48" rx="16"/>
            <text x="600" y="180" font-size="14.5" font-weight="900" text-anchor="middle">챗GPT가 대화를 끝내요</text>
            <line class="line" x1="600" y1="202" x2="600" y2="212" stroke-width="3"/>
            <path class="f-ink" d="M600 222 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="226" width="320" height="48" rx="16"/>
            <text x="600" y="256" font-size="14.5" font-weight="900" text-anchor="middle">여러 번이면 계정을 잠시 멈춰요</text>

            <text x="440" y="318" font-size="15" font-weight="800">보호자에게는</text>
            <text x="440" y="346" font-size="14.5" font-weight="700">청소년 계정이 멈추면 알려 줘요</text>
            <text x="440" y="370" font-size="14.5" font-weight="700">나이 짐작 기능도 더 꼼꼼해져요</text>
            <text x="440" y="414" font-size="14.5" font-weight="900">정확한 시작 날짜는 아직 없어요</text>
          </svg>
