<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">어려운 환자 사례 시험에서 맞힌 비율과 AI가 진단하는 순서</title>
            <desc id="g1d">마이크로소프트가 10월 22일(미국 시간) 학술지 사이언스에 실은 연구다. 의학 학술지의 어려운 환자 사례 시험에서 진단 AI 'MAI-DxO'는 83.2%를 맞혔다. 책과 인터넷을 찾아본 일반 의사는 36.1%, 아무것도 보지 않은 일반 의사는 22.3%를 맞혔다. 막대는 100%를 끝으로 그렸다. AI는 증상을 듣고, 물을 것과 검사를 고르고, 결과를 보고 다시 생각한 뒤 진단을 내린다. 글로 된 사례로 한 시험이고, 실제 병원 시험은 아직이다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">83.2%</text>
            <text x="34" y="170" font-size="16" font-weight="800">AI가 맞힌 비율</text>
            <text class="grey" x="34" y="194" font-size="13.5">의학 학술지의 어려운 환자 사례</text>

            <text x="34" y="234" font-size="13.5" font-weight="800">진단 AI · 83.2%</text>
            <rect class="f-paper" x="34" y="244" width="320" height="26" rx="8"/>
            <rect class="f-blue" x="34" y="244" width="266" height="26" rx="8"/>
            <text x="34" y="302" font-size="13.5" font-weight="800">책과 인터넷을 본 의사 · 36.1%</text>
            <rect class="f-paper" x="34" y="312" width="320" height="26" rx="8"/>
            <rect class="f-ink" x="34" y="312" width="116" height="26" rx="8"/>
            <text x="34" y="370" font-size="13.5" font-weight="800">아무것도 안 본 의사 · 22.3%</text>
            <rect class="f-paper" x="34" y="380" width="320" height="26" rx="8"/>
            <rect class="f-ink" x="34" y="380" width="71" height="26" rx="8"/>
            <text class="grey" x="34" y="436" font-size="12.5">막대는 100%를 끝으로 그렸어요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">AI가 진단하는 순서</text>
            <rect class="f-paper" x="440" y="74" width="320" height="46" rx="16"/>
            <text x="600" y="103" font-size="14.5" font-weight="900" text-anchor="middle">증상을 들어요</text>
            <line class="line" x1="600" y1="124" x2="600" y2="132" stroke-width="3"/>
            <path class="f-ink" d="M600 142 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="146" width="320" height="46" rx="16"/>
            <text x="600" y="175" font-size="14.5" font-weight="900" text-anchor="middle">물을 것과 검사를 골라요</text>
            <line class="line" x1="600" y1="196" x2="600" y2="204" stroke-width="3"/>
            <path class="f-ink" d="M600 214 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="218" width="320" height="46" rx="16"/>
            <text x="600" y="247" font-size="14.5" font-weight="900" text-anchor="middle">결과를 보고 다시 생각해요</text>
            <line class="line" x1="600" y1="268" x2="600" y2="276" stroke-width="3"/>
            <path class="f-ink" d="M600 286 l-8 -12 h16z"/>
            <rect class="f-blue" x="440" y="290" width="320" height="46" rx="16"/>
            <text class="white" x="600" y="319" font-size="14.5" font-weight="900" text-anchor="middle">진단을 내려요</text>
            <text class="grey" x="440" y="372" font-size="12.5">글로 된 사례로 한 시험이에요</text>
            <text class="red" x="440" y="408" font-size="14.5" font-weight="900">실제 병원 시험은 아직이에요</text>
          </svg>
