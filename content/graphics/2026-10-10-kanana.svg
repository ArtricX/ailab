<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">카나나 앱 종료 일정과 백업 마감까지 남은 날</title>
            <desc id="g1d">10월 10일 기준으로 대화 기록 백업 마감까지 4일 남았다. 카카오는 9월 15일 종료를 알렸고, 백업은 10월 14일까지 할 수 있으며, 10월 15일에 카나나 앱과 PC 서비스가 끝난다. 카카오톡 안의 카나나는 그대로 쓸 수 있다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">4일</text>
            <text x="34" y="170" font-size="16" font-weight="800">대화 기록 백업 마감까지</text>
            <text class="grey" x="34" y="194" font-size="13.5">10월 10일 아침 기준</text>

            <rect class="f-paper" x="34" y="256" width="320" height="120" rx="18"/>
            <text x="58" y="300" font-size="15" font-weight="800">그대로 쓸 수 있어요</text>
            <text x="58" y="334" font-size="20" font-weight="900">카카오톡 안의 카나나</text>
            <text class="grey" x="58" y="358" font-size="13.5">따로 받은 앱만 문을 닫아요</text>
            <text class="grey" x="34" y="430" font-size="12">카카오가 9월 15일에 알린 내용이에요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <rect class="f-paper" x="440" y="40" width="320" height="84" rx="16"/>
            <text x="600" y="76" font-size="18" font-weight="900" text-anchor="middle">9월 15일</text>
            <text class="grey" x="600" y="102" font-size="13.5" text-anchor="middle">카카오가 종료를 알렸어요</text>
            <line class="line" x1="600" y1="130" x2="600" y2="156" stroke-width="3"/>
            <path class="f-ink" d="M600 166 l-8 -13 h16z"/>
            <rect class="f-pink" x="440" y="172" width="320" height="94" rx="16"/>
            <text class="red" x="600" y="212" font-size="22" font-weight="900" text-anchor="middle">10월 14일</text>
            <text x="600" y="240" font-size="14" font-weight="700" text-anchor="middle">대화 백업 마지막 날</text>
            <line class="line" x1="600" y1="272" x2="600" y2="298" stroke-width="3"/>
            <path class="f-ink" d="M600 308 l-8 -13 h16z"/>
            <rect class="f-paper" x="440" y="314" width="320" height="84" rx="16"/>
            <text x="600" y="350" font-size="18" font-weight="900" text-anchor="middle">10월 15일</text>
            <text class="grey" x="600" y="376" font-size="13.5" text-anchor="middle">카나나 앱과 PC 서비스 끝</text>
          </svg>
