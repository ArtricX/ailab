<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g3t">내 컴퓨터 안에서만 회의 메모를 만드는 순서</title>
            <desc id="g3d">구글 서버로 보내는 녹음과 회의 기록은 0개다. 회의 중에 짧은 메모를 적으면, 앱이 회의 소리를 내 컴퓨터 안에서 받아 적고, 메모를 자세한 회의록으로 늘려 준다. 맥 컴퓨터용 실험 앱이며 한국어가 잘 되는지는 아직 알려지지 않았다.</desc>
            <text class="num" x="30" y="140" font-size="120" letter-spacing="-4">0</text>
            <text x="34" y="178" font-size="16" font-weight="800">구글 서버로 보내는 녹음과 회의 기록</text>
            <text class="grey" x="34" y="202" font-size="13.5">구글 설명, 모든 처리는 내 컴퓨터 안에서</text>

            <rect class="f-paper" x="34" y="250" width="152" height="40" rx="20"/>
            <rect class="f-paper" x="202" y="250" width="152" height="40" rx="20"/>
            <text x="110" y="276" font-size="15" font-weight="800" text-anchor="middle">맥 컴퓨터용</text>
            <text x="278" y="276" font-size="15" font-weight="800" text-anchor="middle">실험 앱</text>
            <text class="red" x="34" y="350" font-size="15" font-weight="800">한국어가 잘 되는지는</text>
            <text class="red" x="34" y="374" font-size="15" font-weight="800">아직 알려지지 않았어요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <rect class="f-paper" x="440" y="40" width="320" height="84" rx="16"/>
            <text x="600" y="76" font-size="18" font-weight="900" text-anchor="middle">짧은 메모 몇 줄</text>
            <text class="grey" x="600" y="102" font-size="13.5" text-anchor="middle">회의 중에 내가 적어요</text>
            <line class="line" x1="600" y1="130" x2="600" y2="156" stroke-width="3"/>
            <path class="f-ink" d="M600 166 l-8 -13 h16z"/>
            <rect class="f-blue" x="440" y="172" width="320" height="94" rx="16"/>
            <text class="white" x="600" y="212" font-size="18" font-weight="900" text-anchor="middle">회의 소리 받아 적기</text>
            <text class="white" x="600" y="240" font-size="13.5" text-anchor="middle">인터넷 없이 내 컴퓨터 안에서</text>
            <line class="line" x1="600" y1="272" x2="600" y2="298" stroke-width="3"/>
            <path class="f-ink" d="M600 308 l-8 -13 h16z"/>
            <rect class="f-paper" x="440" y="314" width="320" height="84" rx="16"/>
            <text x="600" y="350" font-size="18" font-weight="900" text-anchor="middle">자세한 회의 메모</text>
            <text class="grey" x="600" y="376" font-size="13.5" text-anchor="middle">빠진 내용을 채워 줘요</text>
          </svg>
