<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">넷플릭스의 새 AI 추천 화면 'AI 디스커버'</title>
            <desc id="g1d">넷플릭스는 미국 시간 11월 3일, 텔레비전 앱에 'AI 디스커버'라는 새 화면을 시험으로 열었다. 가볍게 볼 것, 무서운 것, 가족 영화의 밤, 짧게 볼 것 같은 주제를 고르면 짧은 영상으로 맛보기를 보여 주고, 고른 주제에 맞는 작품과 더 좁은 주제를 알려 준다. 작품마다 추천을 손보는 버튼이 있어 다시 보고 싶지 않은 작품을 뺄 수 있다. 처음에는 미국에서 영어로 넷플릭스를 쓰는 일부 회원의 지원되는 텔레비전에서만 열리고, 몇 주에 걸쳐 늘려 간다. 다른 나라 출시 계획은 밝히지 않았다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">4가지</text>
            <text x="34" y="170" font-size="16" font-weight="800">처음 보여 준 기분 주제의 예</text>
            <text class="grey" x="34" y="194" font-size="13.5">넷플릭스 · 미국 시간 11월 3일 발표</text>

            <rect class="f-pink" x="34" y="216" width="155" height="44" rx="14"/>
            <text x="111" y="244" font-size="14.5" font-weight="900" text-anchor="middle">가볍게 볼 것</text>
            <rect class="f-pink" x="199" y="216" width="155" height="44" rx="14"/>
            <text x="276" y="244" font-size="14.5" font-weight="900" text-anchor="middle">무서운 것</text>
            <rect class="f-pink" x="34" y="270" width="155" height="44" rx="14"/>
            <text x="111" y="298" font-size="14.5" font-weight="900" text-anchor="middle">가족 영화의 밤</text>
            <rect class="f-pink" x="199" y="270" width="155" height="44" rx="14"/>
            <text x="276" y="298" font-size="14.5" font-weight="900" text-anchor="middle">짧게 볼 것</text>

            <text x="34" y="352" font-size="14.5" font-weight="700">주제마다 짧은 영상으로</text>
            <text x="34" y="376" font-size="14.5" font-weight="700">미리 맛보기를 보여 줘요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">이렇게 골라요</text>
            <rect class="f-paper" x="440" y="74" width="320" height="44" rx="14"/>
            <text x="600" y="102" font-size="14.5" font-weight="900" text-anchor="middle">지금 기분에 맞는 주제 고르기</text>
            <line class="line" x1="600" y1="122" x2="600" y2="130" stroke-width="3"/>
            <path class="f-ink" d="M600 140 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="144" width="320" height="44" rx="14"/>
            <text x="600" y="172" font-size="14.5" font-weight="900" text-anchor="middle">맞는 작품과 더 좁은 주제 보기</text>
            <line class="line" x1="600" y1="192" x2="600" y2="200" stroke-width="3"/>
            <path class="f-ink" d="M600 210 l-8 -12 h16z"/>
            <rect class="f-pink" x="440" y="214" width="320" height="44" rx="14"/>
            <text x="600" y="242" font-size="14.5" font-weight="900" text-anchor="middle">싫은 작품은 추천에서 빼기</text>

            <text x="440" y="300" font-size="15" font-weight="800">처음 열리는 곳</text>
            <text x="440" y="328" font-size="14.5" font-weight="700">미국, 영어로 쓰는 일부 회원</text>
            <text x="440" y="352" font-size="14.5" font-weight="700">지원되는 텔레비전 앱에서만</text>
            <text class="red" x="440" y="414" font-size="14.5" font-weight="900">다른 나라 계획은 아직 몰라요</text>
          </svg>
