<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g2t">스웨덴 TV 프로그램 편집본이 사라진 과정</title>
            <desc id="g2d">스웨덴 신문 아프톤블라데트가 10월 15일 보도했다. 제작사가 다 만든 편집본을 서버에 두고 AI 에이전트에게 서버를 다룰 수 있게 해 줬는데, 편집본이 지워졌고 백업도 되지 않았다고 한다. 원래 11월 22일이던 첫 방송은 2027년으로 미뤄졌다. 찍어 둔 원본 영상은 남아 있어 편집을 처음부터 다시 해야 한다. 방송사 TV4는 기술적 문제라고 했다가, 조사해 보니 AI가 아니라 제작사 사람의 실수였다고 밝혔다.</desc>
            <text class="num" x="30" y="132" font-size="100" letter-spacing="-4">2027년</text>
            <text x="34" y="170" font-size="16" font-weight="800">첫 방송이 미뤄졌어요</text>
            <text class="grey" x="34" y="194" font-size="13.5">원래는 11월 22일 첫 방송이었어요</text>

            <rect class="f-paper" x="34" y="226" width="320" height="52" rx="16"/>
            <text x="194" y="258" font-size="14.5" font-weight="900" text-anchor="middle">다 만든 편집본을 서버에 뒀어요</text>
            <line class="line" x1="194" y1="284" x2="194" y2="296" stroke-width="3"/>
            <path class="f-ink" d="M194 306 l-8 -12 h16z"/>
            <rect class="f-blue" x="34" y="310" width="320" height="52" rx="16"/>
            <text class="white" x="194" y="342" font-size="14.5" font-weight="900" text-anchor="middle">AI 에이전트에게 서버를 맡겼대요</text>
            <line class="line" x1="194" y1="368" x2="194" y2="380" stroke-width="3"/>
            <path class="f-ink" d="M194 390 l-8 -12 h16z"/>
            <rect class="f-paper" x="34" y="394" width="320" height="52" rx="16"/>
            <text x="194" y="426" font-size="14.5" font-weight="900" text-anchor="middle">편집본이 지워지고 백업도 안 됐어요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">남은 것과 할 일</text>
            <rect class="f-paper" x="440" y="74" width="320" height="64" rx="16"/>
            <text x="460" y="102" font-size="16" font-weight="900">찍어 둔 원본 영상</text>
            <text class="grey" x="460" y="124" font-size="12.5">지워지지 않고 남아 있어요</text>
            <rect class="f-blue" x="440" y="148" width="320" height="64" rx="16"/>
            <text class="white" x="460" y="176" font-size="16" font-weight="900">편집을 처음부터 다시</text>
            <text class="white" x="460" y="198" font-size="12.5">그래서 첫 방송이 미뤄졌어요</text>

            <text x="440" y="262" font-size="15" font-weight="800">방송사의 설명</text>
            <rect class="f-paper" x="440" y="278" width="320" height="52" rx="16"/>
            <text x="600" y="310" font-size="14.5" font-weight="900" text-anchor="middle">처음엔 기술적 문제라고 했어요</text>
            <rect class="f-paper" x="440" y="340" width="320" height="52" rx="16"/>
            <text class="red" x="600" y="372" font-size="14.5" font-weight="900" text-anchor="middle">조사해 보니 AI가 아닌 사람 실수</text>
            <text class="grey" x="440" y="424" font-size="12.5">스웨덴 신문 아프톤블라데트 첫 보도</text>
          </svg>
