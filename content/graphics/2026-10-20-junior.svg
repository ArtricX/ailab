<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g2t">앤트로픽 기술직 채용에서 신입이 차지한 몫과 AI가 일한 시간</title>
            <desc id="g2d">AI 회사 앤트로픽이 10월 16일 낸 보고서에 따르면 새로 뽑은 기술직 가운데 신입의 몫은 2025년 초 27퍼센트에서 지금 9퍼센트로 줄었다. 기술 부서 전체에서 신입의 몫도 21퍼센트에서 14퍼센트로 줄었다. 막대는 0부터 27퍼센트를 기준으로 그렸다. 올해 8월에는 직원들이 시킨 AI가 일한 시간이 직원 근무 시간의 6배였다. 여러 AI가 동시에 일한 시간을 모두 더한 값이다. 기술직으로 뽑은 사람의 수 자체는 늘었다. 숫자는 회사가 직접 낸 것이다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">9%</text>
            <text x="34" y="170" font-size="16" font-weight="800">새로 뽑은 기술직 가운데 신입</text>
            <text class="grey" x="34" y="194" font-size="13.5">앤트로픽 보고서 · 10월 16일</text>

            <text x="34" y="240" font-size="13.5" font-weight="800">2025년 초 · 27%</text>
            <rect class="f-paper" x="34" y="250" width="300" height="30" rx="8"/>
            <text class="red" x="34" y="314" font-size="13.5" font-weight="800">지금 · 9%</text>
            <rect class="f-yellow" x="34" y="324" width="100" height="30" rx="8"/>
            <text x="34" y="392" font-size="13.5" font-weight="700">기술 부서 전체의 신입도</text>
            <text x="34" y="414" font-size="13.5" font-weight="700">21% → 14%로 줄었어요</text>
            <text class="grey" x="34" y="444" font-size="12.5">막대는 0부터 27%를 기준으로 그렸어요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">8월, 일한 시간을 견주면</text>
            <text x="440" y="96" font-size="13.5" font-weight="800">직원</text>
            <rect class="f-ink" x="500" y="78" width="36" height="28" rx="6"/>
            <text x="440" y="140" font-size="13.5" font-weight="800">AI</text>
            <rect class="f-yellow" x="500" y="122" width="36" height="28" rx="6"/>
            <rect class="f-yellow" x="544" y="122" width="36" height="28" rx="6"/>
            <rect class="f-yellow" x="588" y="122" width="36" height="28" rx="6"/>
            <rect class="f-yellow" x="632" y="122" width="36" height="28" rx="6"/>
            <rect class="f-yellow" x="676" y="122" width="36" height="28" rx="6"/>
            <rect class="f-yellow" x="720" y="122" width="36" height="28" rx="6"/>
            <text x="440" y="188" font-size="14.5" font-weight="900">직원이 시킨 AI가 6배 더 일했어요</text>
            <text class="grey" x="440" y="212" font-size="12.5">여러 AI가 동시에 일한 시간을 더한 값이에요</text>

            <rect class="f-yellow" x="440" y="248" width="320" height="64" rx="16"/>
            <text x="460" y="276" font-size="15" font-weight="900">뽑은 사람 수는 늘었어요</text>
            <text x="460" y="298" font-size="12.5">회사가 커지며 경력자를 더 뽑았어요</text>

            <text x="440" y="356" font-size="14.5" font-weight="800">한 회사의 숫자예요</text>
            <text class="grey" x="440" y="384" font-size="12.5">회사가 직접 낸 숫자이고</text>
            <text class="grey" x="440" y="406" font-size="12.5">다른 곳에서 따로 확인하지는 않았어요</text>
          </svg>
