<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g3t">법정에서 가짜 영상 다툼을 겪어 본 판사와 AI 회사들의 말</title>
            <desc id="g3d">미국 연방사법센터가 판사들에게 물었더니, 답한 931명 가운데 상대가 증거를 AI로 만든 가짜라고 다툰 일을 겪어 본 판사는 15명이었다. 막대는 실제 비율대로 그렸다. 10월 15일 미국 법원 증거 규칙 위원회 회의에서 메타는 최신 AI가 만든 것은 사람 눈으로 구별하기 어렵고 만드는 데 돈과 시간도 적게 든다고 했다. 오픈AI는 워터마크가 회사마다 달라서 모두 찾아내는 방법이 없다고 했다. 위원회는 가짜라고 하려면 먼저 근거를 내고, 그러면 영상을 낸 쪽이 진짜일 가능성이 더 높다는 것을 보이게 하는 규칙을 검토하고 있다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">15명</text>
            <text x="34" y="170" font-size="16" font-weight="800">가짜 영상 다툼을 겪어 본 판사</text>
            <text class="grey" x="34" y="194" font-size="13.5">미국 판사 931명에게 물어본 결과</text>

            <rect class="f-paper" x="34" y="232" width="320" height="40" rx="10"/>
            <text x="48" y="258" font-size="13.5" font-weight="800">물어본 판사 931명</text>
            <rect class="f-red" x="34" y="284" width="5" height="40" rx="2"/>
            <text x="50" y="310" font-size="13.5" font-weight="800">겪어 본 판사 15명</text>
            <text class="grey" x="34" y="346" font-size="12.5">막대 길이는 실제 비율 그대로예요</text>

            <text x="34" y="390" font-size="14" font-weight="800">아직은 드문 일이에요</text>
            <text x="34" y="422" font-size="15" font-weight="900">그래도 미리 규칙을 고민해요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">AI 회사들의 말</text>
            <rect class="f-yellow" x="440" y="74" width="320" height="64" rx="16"/>
            <text x="460" y="102" font-size="15" font-weight="900">사람 눈으로는 구별이 어려워요</text>
            <text x="460" y="124" font-size="12.5">메타 · 만드는 데 돈과 시간도 적게 들어요</text>
            <rect class="f-paper" x="440" y="148" width="320" height="64" rx="16"/>
            <text x="460" y="176" font-size="15" font-weight="900">워터마크는 회사마다 달라요</text>
            <text class="grey" x="460" y="198" font-size="12.5">오픈AI · 모두 찾아내는 방법은 없어요</text>

            <text x="440" y="262" font-size="15" font-weight="800">검토 중인 새 규칙</text>
            <rect class="f-paper" x="440" y="278" width="320" height="52" rx="16"/>
            <text x="600" y="310" font-size="14.5" font-weight="900" text-anchor="middle">가짜라고 하려면 근거부터 내요</text>
            <rect class="f-paper" x="440" y="340" width="320" height="52" rx="16"/>
            <text x="600" y="372" font-size="14.5" font-weight="900" text-anchor="middle">그러면 영상 낸 쪽이 진짜임을 보여요</text>
            <text class="grey" x="440" y="424" font-size="12.5">미국 법원 증거 규칙 위원회 · 10월 15일</text>
          </svg>
