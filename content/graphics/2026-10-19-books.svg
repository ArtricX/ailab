<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">출판계 호소문에 이름을 올린 곳과 요구 세 가지</title>
            <desc id="g1d">한국출판인회의가 10월 15일부터 AI 학습에 관한 호소문에 이름을 받았다. 10월 16일 오전에는 출판사와 단체 158곳, 개인 321명이었고, 오후 2시에는 169곳과 343명, 오후 4시에는 172곳과 348명으로 늘었다. 막대는 0부터 172곳을 기준으로 그렸다. 요구는 세 가지다. AI 회사가 어떤 책을 어디서 가져와 학습에 썼는지 밝히고, 권리자의 허락을 먼저 받으며, 가만히 있다고 허락으로 보지 말고, 정당한 대가를 내라는 것이다. 독일 출판계의 프랑크푸르트 호소문과 뜻을 같이했다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">172곳</text>
            <text x="34" y="170" font-size="16" font-weight="800">호소문에 이름을 올린 출판사·단체</text>
            <text class="grey" x="34" y="194" font-size="13.5">10월 16일 오후 4시 기준</text>

            <text x="34" y="240" font-size="13.5" font-weight="800">16일 오전 · 158곳</text>
            <rect class="f-paper" x="34" y="250" width="294" height="30" rx="8"/>
            <text x="34" y="314" font-size="13.5" font-weight="800">오후 2시 · 169곳</text>
            <rect class="f-paper" x="34" y="324" width="314" height="30" rx="8"/>
            <text class="red" x="34" y="388" font-size="13.5" font-weight="800">오후 4시 · 172곳</text>
            <rect class="f-pink" x="34" y="398" width="320" height="30" rx="8"/>
            <text class="grey" x="34" y="450" font-size="12.5">작가·번역가 등 개인도 321명 → 348명</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">AI 회사에 바라는 세 가지</text>
            <rect class="f-pink" x="440" y="74" width="320" height="64" rx="16"/>
            <text x="460" y="102" font-size="15.5" font-weight="900">어떤 책을 썼는지 밝혀요</text>
            <text x="460" y="124" font-size="12.5">어디서 가져왔는지도 확인하게 해요</text>
            <rect class="f-paper" x="440" y="148" width="320" height="64" rx="16"/>
            <text x="460" y="176" font-size="15.5" font-weight="900">허락이 먼저예요</text>
            <text class="grey" x="460" y="198" font-size="12.5">가만히 있다고 허락한 게 아니에요</text>
            <rect class="f-paper" x="440" y="222" width="320" height="64" rx="16"/>
            <text x="460" y="250" font-size="15.5" font-weight="900">정당한 대가를 내요</text>
            <text class="grey" x="460" y="272" font-size="12.5">작은 출판사와 작가도 똑같이요</text>

            <text x="440" y="336" font-size="14.5" font-weight="800">정부와 국회에 전할 예정이에요</text>
            <text class="grey" x="440" y="364" font-size="12.5">독일 출판계의 프랑크푸르트 호소문과</text>
            <text class="grey" x="440" y="386" font-size="12.5">뜻을 같이했어요</text>
            <text class="grey" x="440" y="424" font-size="12.5">막대는 0부터 172곳을 기준으로 그렸어요</text>
          </svg>
