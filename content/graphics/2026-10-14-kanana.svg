<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">카카오톡 AI 비서 카나나 스페이스를 쓰는 순서와 보여 준 일</title>
            <desc id="g1d">카카오는 카카오톡 AI 비서 카나나 스페이스의 사전 신청을 10월 13일부터 받고, 신청자 가운데 일부가 12월부터 차례로 써 본다. 쓰는 순서는 두 손가락으로 화면 쓸어내리기, 말로 부탁하기, 내가 확인하고 누르기다. 메시지 보내기와 결제는 이용자가 마지막에 직접 확인해야 한다. 행사에서는 가족 단톡방에서 어린이집에 데리러 갈 시간을 찾아 알려 주고, 생수 주문을 부탁하면 전에 산 생수를 고르고 쿠폰을 붙여 결제 직전까지 준비하는 모습을 보였다. 앞으로 주문, 선물, 예약, 송금까지 넓힐 계획이다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">12월</text>
            <text x="34" y="170" font-size="16" font-weight="800">신청한 사람 일부부터 써 봐요</text>
            <text class="grey" x="34" y="194" font-size="13.5">사전 신청은 10월 13일부터 받아요</text>

            <text x="34" y="244" font-size="14" font-weight="800">쓰는 순서</text>
            <rect class="f-yellow" x="34" y="258" width="320" height="48" rx="16"/>
            <text x="54" y="288" font-size="15" font-weight="900">두 손가락으로 쓸어내리기</text>
            <path class="f-ink" d="M194 322 l-8 -12 h16z"/>
            <rect class="f-paper" x="34" y="326" width="320" height="48" rx="16"/>
            <text x="54" y="356" font-size="15" font-weight="900">말로 부탁하기</text>
            <path class="f-ink" d="M194 390 l-8 -12 h16z"/>
            <rect class="f-paper" x="34" y="394" width="320" height="48" rx="16"/>
            <text x="54" y="424" font-size="15" font-weight="900">보내기 · 결제는</text>
            <text class="red" x="334" y="424" font-size="14" font-weight="800" text-anchor="end">내가 눌러요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">행사에서 보여 준 일</text>
            <rect class="f-paper" x="440" y="72" width="320" height="84" rx="16"/>
            <text x="600" y="106" font-size="16" font-weight="900" text-anchor="middle">"오늘 일정 알려 줘"</text>
            <text class="grey" x="600" y="134" font-size="13" text-anchor="middle">가족 단톡방에서 데리러 갈 시간을 찾아요</text>
            <rect class="f-paper" x="440" y="166" width="320" height="84" rx="16"/>
            <text x="600" y="200" font-size="16" font-weight="900" text-anchor="middle">"생수 주문해 줘"</text>
            <text class="grey" x="600" y="228" font-size="13" text-anchor="middle">전에 산 생수에 쿠폰까지 붙여요</text>

            <text x="440" y="296" font-size="15" font-weight="800">앞으로 넓힐 일</text>
            <rect class="f-yellow" x="440" y="312" width="150" height="48" rx="16"/>
            <text x="515" y="342" font-size="15" font-weight="900" text-anchor="middle">주문</text>
            <rect class="f-yellow" x="610" y="312" width="150" height="48" rx="16"/>
            <text x="685" y="342" font-size="15" font-weight="900" text-anchor="middle">선물</text>
            <rect class="f-yellow" x="440" y="370" width="150" height="48" rx="16"/>
            <text x="515" y="400" font-size="15" font-weight="900" text-anchor="middle">예약</text>
            <rect class="f-yellow" x="610" y="370" width="150" height="48" rx="16"/>
            <text x="685" y="400" font-size="15" font-weight="900" text-anchor="middle">송금</text>
          </svg>
