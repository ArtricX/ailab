<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g3t">AI를 쓰는 작은 회사의 비율과 직원을 늘리겠다는 답의 차이</title>
            <desc id="g3d">직원이 있는 미국 작은 회사 5,248곳 중 46%가 AI를 쓴다. 앞으로 1년 동안 직원을 늘리겠다는 비율에서 줄이겠다는 비율을 뺀 값은 AI를 쓰는 곳이 33점, 안 쓰는 곳이 15점이다. AI를 쓰는 곳의 77%는 AI 때문에 인건비가 바뀌지 않았다고 답했다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">46%</text>
            <text x="34" y="170" font-size="16" font-weight="800">AI를 쓰는 작은 회사</text>
            <text class="grey" x="34" y="194" font-size="13.5">직원이 있는 미국 작은 회사 5,248곳</text>

            <rect class="f-paper" x="34" y="250" width="320" height="140" rx="18"/>
            <text class="num" x="58" y="318" font-size="56" letter-spacing="-2">77%</text>
            <text x="58" y="350" font-size="14" font-weight="700">AI를 쓰는 곳 중, AI 때문에</text>
            <text x="58" y="372" font-size="14" font-weight="700">인건비는 그대로라고 했어요</text>
            <text class="grey" x="34" y="430" font-size="12">2025년 가을 조사, 뉴욕 연방준비은행 분석</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="430" y="62" font-size="16" font-weight="800">직원을 늘리겠다는 답</text>
            <text class="grey" x="430" y="86" font-size="13">늘리겠다(%)에서 줄이겠다(%)를 뺀 값</text>
            <line class="line" x1="440" y1="380" x2="760" y2="380" stroke-width="3"/>
            <rect class="f-yellow" x="480" y="149" width="100" height="231" rx="12"/>
            <rect class="f-paper" x="630" y="275" width="100" height="105" rx="12"/>
            <text class="num red" x="530" y="137" font-size="34" text-anchor="middle">+33</text>
            <text class="num" x="680" y="263" font-size="30" text-anchor="middle">+15</text>
            <text x="530" y="406" font-size="14" font-weight="700" text-anchor="middle">AI를 쓰는 곳</text>
            <text x="680" y="406" font-size="14" font-weight="700" text-anchor="middle">안 쓰는 곳</text>
            <text class="grey" x="430" y="440" font-size="12">높이는 점수에 맞춘 같은 눈금이에요</text>
          </svg>
