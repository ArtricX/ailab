<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g3t">자동차 공장에서 로봇이 부품을 골라 담은 성공률</title>
            <desc id="g3d">구글 딥마인드는 11월 10일 로봇용 AI 제미나이 로보틱스 2.5를 내놓았다. 이 AI를 넣은 사람 모양 로봇 아폴로 2가 헝가리 케치케메트와 독일 진델핑겐의 메르세데스벤츠 공장 생산 줄에서 쇠 부품을 골라 담는 일을 했고, 성공률은 96%였다. 큰 통에 섞인 부품을 로봇이 보고 골라 집어, 차마다 쓸 순서대로 판에 담는다. 딥마인드는 200가지가 넘는 일로 시험했고, 집게로 음식 담기와 선물 상자에 리본 묶기 같은 솜씨도 보여 줬다. 아직은 딥마인드와 함께 일하는 로봇 회사들에 먼저 주어진다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">96%</text>
            <text x="34" y="170" font-size="16" font-weight="800">부품을 골라 담은 성공률</text>
            <text class="grey" x="34" y="194" font-size="13.5">딥마인드 발표 · 11월 10일</text>
            <rect class="f-ground" x="34" y="216" width="320" height="28" rx="6"/>
            <rect class="f-green" x="34" y="216" width="307" height="28" rx="6"/>
            <text x="34" y="268" font-size="13.5" font-weight="700">해낸 일 96%</text>
            <text class="red" x="354" y="268" font-size="13.5" font-weight="900" text-anchor="end">실수 4%</text>
            <text x="34" y="316" font-size="15" font-weight="800">시험한 곳</text>
            <rect class="f-paper" x="34" y="332" width="320" height="40" rx="14"/>
            <text x="194" y="358" font-size="14.5" font-weight="900" text-anchor="middle">헝가리 케치케메트 공장</text>
            <rect class="f-paper" x="34" y="382" width="320" height="40" rx="14"/>
            <text x="194" y="408" font-size="14.5" font-weight="900" text-anchor="middle">독일 진델핑겐 공장</text>
            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>
            <text x="440" y="56" font-size="15" font-weight="800">로봇이 한 일</text>
            <rect class="f-paper" x="440" y="74" width="320" height="44" rx="14"/>
            <text x="600" y="102" font-size="14.5" font-weight="900" text-anchor="middle">큰 통에 쇠 부품이 섞여 있어요</text>
            <line class="line" x1="600" y1="122" x2="600" y2="134" stroke-width="3"/>
            <path class="f-ink" d="M592 134L608 134L600 144Z"/>
            <rect class="f-green" x="440" y="150" width="320" height="44" rx="14"/>
            <text x="600" y="178" font-size="14.5" font-weight="900" text-anchor="middle">로봇이 보고 골라 집어요</text>
            <line class="line" x1="600" y1="198" x2="600" y2="210" stroke-width="3"/>
            <path class="f-ink" d="M592 210L608 210L600 220Z"/>
            <rect class="f-paper" x="440" y="226" width="320" height="44" rx="14"/>
            <text x="600" y="254" font-size="14.5" font-weight="900" text-anchor="middle">차마다 쓸 순서대로 판에 담아요</text>
            <text x="440" y="320" font-size="15" font-weight="800">새로 보여 준 솜씨</text>
            <text x="440" y="348" font-size="14.5" font-weight="700">집게로 음식 담기, 리본 묶기</text>
            <text x="440" y="372" font-size="14.5" font-weight="700">200가지 넘는 일로 시험했어요</text>
          </svg>
