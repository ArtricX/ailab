<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="480" fill="#EDEEF0"/>
            <title id="g2t">가장 싼 표를 부탁했을 때의 추천 값과 비싼 쪽을 고른 AI 수</title>
            <desc id="g2d">연구의 예시에서 가장 싼 비행기 표를 부탁하자, 사람 정보 없이 고른 AI는 91달러 표를, 부자로 보이는 메일을 읽은 AI는 601달러 표를 추천했다. 시험한 AI 13개 중 8개가 부자로 보이는 사람에게 더 비싼 것을 골랐다. 가격 상한을 숫자로 정하면 대부분의 AI에서 차이가 크게 줄었다.</desc>
            <text x="32" y="52" font-size="18" font-weight="800">가장 싼 표를 부탁했을 때</text>
            <line class="line" x1="30" y1="400" x2="350" y2="400" stroke-width="3"/>
            <rect class="f-paper" x="60" y="358" width="100" height="42" rx="10"/>
            <rect class="f-yellow" x="210" y="120" width="100" height="280" rx="14"/>
            <text class="num" x="110" y="342" font-size="30" text-anchor="middle">$91</text>
            <text class="num red" x="260" y="104" font-size="34" text-anchor="middle">$601</text>
            <text x="110" y="426" font-size="14" font-weight="700" text-anchor="middle">내 정보 없이</text>
            <text x="260" y="426" font-size="14" font-weight="700" text-anchor="middle">부자 같은 메일을</text>
            <text x="260" y="446" font-size="14" font-weight="700" text-anchor="middle">읽은 뒤</text>
            <text class="grey" x="32" y="472" font-size="12">연구 속 한 가지 예시예요. 높이는 금액에 맞춘 같은 눈금이에요</text>

            <line class="line-grey" x1="396" y1="30" x2="396" y2="450" stroke-width="2"/>

            <text x="426" y="80" font-size="16" font-weight="800">시험한 AI 13개 중</text>
            <text class="num" x="420" y="190" font-size="110" letter-spacing="-4">8개</text>
            <text x="426" y="226" font-size="15">부자로 보이면 더 비싼 걸 골랐어요</text>

            <rect class="f-yellow" x="420" y="276" width="350" height="140" rx="18"/>
            <text x="444" y="316" font-size="15" font-weight="800">이렇게 하면 차이가 크게 줄었어요</text>
            <text x="444" y="358" font-size="22" font-weight="900">가격 상한을 숫자로 말하기</text>
            <text x="444" y="392" font-size="14">예: 30만 원 아래에서 찾아 줘</text>
          </svg>
