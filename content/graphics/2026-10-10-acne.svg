<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="470" fill="#EDEEF0"/>
            <title id="g2t">AI 여드름 처방 시험에서 처방전이 나오는 순서와 처음 단계의 의사 확인</title>
            <desc id="g2d">처음 환자 100명은 처방전이 약국에 가기 전에 의사가 먼저 확인한다. 순서는 얼굴 사진 올리기, AI가 피부 살펴보기, 의사 확인, 바르는 약 처방이다. 한 달 사용료는 4.99달러이고 시험은 1년 동안 한다. 먹는 약은 AI가 처방하지 않는다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">100명</text>
            <text x="34" y="170" font-size="16" font-weight="800">처음 환자는 의사가 먼저 확인해요</text>
            <text class="grey" x="34" y="194" font-size="13.5">처방전이 약국에 가기 전에</text>

            <rect class="f-paper" x="34" y="244" width="152" height="100" rx="18"/>
            <text class="num" x="110" y="290" font-size="27" text-anchor="middle">4.99달러</text>
            <text x="110" y="322" font-size="13.5" font-weight="700" text-anchor="middle">한 달 사용료</text>
            <rect class="f-paper" x="202" y="244" width="152" height="100" rx="18"/>
            <text class="num" x="278" y="292" font-size="34" text-anchor="middle">1년</text>
            <text x="278" y="322" font-size="13.5" font-weight="700" text-anchor="middle">시험 기간</text>
            <text class="red" x="34" y="390" font-size="15" font-weight="800">먹는 약은 AI가 처방하지 않아요</text>
            <text class="grey" x="34" y="440" font-size="12">유타주 어른, 가볍거나 중간 정도 여드름만</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="450" stroke-width="2"/>

            <rect class="f-paper" x="440" y="30" width="320" height="70" rx="16"/>
            <text x="600" y="62" font-size="18" font-weight="900" text-anchor="middle">얼굴 사진 올리기</text>
            <text class="grey" x="600" y="86" font-size="13.5" text-anchor="middle">여러 조명에서 찍은 사진</text>
            <line class="line" x1="600" y1="104" x2="600" y2="120" stroke-width="3"/>
            <path class="f-ink" d="M600 130 l-8 -13 h16z"/>
            <rect class="f-green" x="440" y="136" width="320" height="70" rx="16"/>
            <text x="600" y="168" font-size="18" font-weight="900" text-anchor="middle">AI가 피부 살펴보기</text>
            <text x="600" y="192" font-size="13.5" text-anchor="middle">정해진 약 목록에서 고르기</text>
            <line class="line" x1="600" y1="210" x2="600" y2="226" stroke-width="3"/>
            <path class="f-ink" d="M600 236 l-8 -13 h16z"/>
            <rect class="f-paper" x="440" y="242" width="320" height="70" rx="16"/>
            <text x="600" y="274" font-size="18" font-weight="900" text-anchor="middle">의사가 확인하기</text>
            <text class="grey" x="600" y="298" font-size="13.5" text-anchor="middle">처음 단계에서는 모두</text>
            <line class="line" x1="600" y1="316" x2="600" y2="332" stroke-width="3"/>
            <path class="f-ink" d="M600 342 l-8 -13 h16z"/>
            <rect class="f-paper" x="440" y="348" width="320" height="70" rx="16"/>
            <text x="600" y="380" font-size="18" font-weight="900" text-anchor="middle">바르는 약 처방</text>
            <text class="grey" x="600" y="404" font-size="13.5" text-anchor="middle">크림이나 젤</text>
          </svg>
