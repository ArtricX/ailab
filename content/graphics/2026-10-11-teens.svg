<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g2t">쉬는 시간 알림의 효과와 청소년이 한 주에 쓴 공부 기능</title>
            <desc id="g2d">쉬어 가라는 알림이 나온 청소년 대화의 절반 가까이에서 5분 안에 쉬거나 대화를 끝냈다. 청소년의 하루 평균 사용 시간은 15분이 안 된다. 한 주 동안 수학과 과학 그림 설명은 약 120만 명, 단계별 공부 모드는 18만 명 넘게 썼다. 새로 생긴 것은 낱말 카드, 퀴즈, 대학 지원 계획표이고, 대학 지원 계획표는 미국 고등학생부터 시작한다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">절반</text>
            <text x="34" y="170" font-size="16" font-weight="800">가까이가 5분 안에 쉬거나 멈췄어요</text>
            <text class="grey" x="34" y="194" font-size="13.5">쉬어 가라는 알림이 나온 대화 가운데</text>

            <text x="34" y="250" font-size="14" font-weight="800">한 주 동안 쓴 청소년</text>
            <rect class="f-pink" x="34" y="264" width="300" height="34" rx="10"/>
            <text x="46" y="287" font-size="13.5" font-weight="800">약 120만 명</text>
            <text class="grey" x="34" y="318" font-size="12.5">수학·과학 그림 설명</text>
            <rect class="f-pink" x="34" y="334" width="45" height="34" rx="10"/>
            <text x="90" y="357" font-size="13.5" font-weight="800">18만 명 넘게</text>
            <text class="grey" x="34" y="388" font-size="12.5">한 단계씩 배우는 공부 모드</text>
            <text class="grey" x="34" y="438" font-size="12">하루 평균 사용 시간은 15분이 안 돼요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">새로 생긴 공부 도구</text>
            <rect class="f-paper" x="440" y="74" width="320" height="84" rx="16"/>
            <text x="600" y="110" font-size="18" font-weight="900" text-anchor="middle">낱말 카드</text>
            <text class="grey" x="600" y="136" font-size="13.5" text-anchor="middle">틀린 카드만 다시 볼 수 있어요</text>
            <rect class="f-paper" x="440" y="170" width="320" height="84" rx="16"/>
            <text x="600" y="206" font-size="18" font-weight="900" text-anchor="middle">퀴즈</text>
            <text class="grey" x="600" y="232" font-size="13.5" text-anchor="middle">내 공책으로 문제를 만들어요</text>
            <rect class="f-pink" x="440" y="266" width="320" height="94" rx="16"/>
            <text x="600" y="304" font-size="18" font-weight="900" text-anchor="middle">대학 지원 계획표</text>
            <text x="600" y="332" font-size="13.5" text-anchor="middle">마감일과 할 일을 한눈에</text>
            <text class="red" x="600" y="400" font-size="14" font-weight="800" text-anchor="middle">계획표는 미국 고등학생부터 시작해요</text>
          </svg>
