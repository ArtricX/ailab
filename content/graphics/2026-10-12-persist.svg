<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="470" fill="#EDEEF0"/>
            <title id="g1t">AI를 치운 뒤 혼자 문제를 맞힌 비율과 쓰는 방법에 따라 건너뛴 문제 비율</title>
            <desc id="g1d">사람들은 약 10분 동안 AI의 도움을 받다가, AI를 치운 뒤 혼자 문제를 풀었다. 첫 번째 실험(354명)의 분수 문제에서 처음부터 혼자 푼 사람은 73%를 맞혔고, AI를 쓰다가 멈춘 사람은 57%를 맞혔다. 두 번째 실험에서 건너뛴 문제 비율은 AI에게 답을 그대로 받은 사람이 13%, 힌트만 받은 사람이 5%, AI 없이 푼 사람이 7%였다. 세 번의 실험에 모두 1,222명이 참여했다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">10분</text>
            <text x="34" y="170" font-size="16" font-weight="800">쯤 AI의 도움을 받았어요</text>
            <text class="grey" x="34" y="194" font-size="13.5">그 뒤 AI를 치우고 혼자 풀게 했어요</text>

            <text x="34" y="244" font-size="14" font-weight="800">AI를 치운 뒤 맞힌 비율 (분수 문제)</text>
            <text class="grey" x="34" y="272" font-size="12.5">처음부터 혼자 푼 사람</text>
            <rect class="f-blue" x="34" y="282" width="241" height="30" rx="10"/>
            <text x="285" y="304" font-size="14" font-weight="800">73%</text>
            <text class="grey" x="34" y="340" font-size="12.5">AI를 쓰다가 멈춘 사람</text>
            <rect class="f-blue" x="34" y="350" width="188" height="30" rx="10"/>
            <text class="red" x="232" y="372" font-size="14" font-weight="800">57%</text>
            <text class="grey" x="34" y="448" font-size="12">354명이 참여한 첫 번째 실험이에요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="450" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">건너뛴 문제 비율 (두 번째 실험)</text>
            <text class="grey" x="440" y="94" font-size="12.5">AI에게 답을 그대로 받은 사람</text>
            <rect class="f-blue" x="440" y="104" width="195" height="30" rx="10"/>
            <text x="645" y="126" font-size="14" font-weight="800">13%</text>
            <text class="grey" x="440" y="162" font-size="12.5">AI 없이 푼 사람</text>
            <rect class="f-blue" x="440" y="172" width="105" height="30" rx="10"/>
            <text x="555" y="194" font-size="14" font-weight="800">7%</text>
            <text class="grey" x="440" y="230" font-size="12.5">AI에게 힌트만 받은 사람</text>
            <rect class="f-blue" x="440" y="240" width="75" height="30" rx="10"/>
            <text x="525" y="262" font-size="14" font-weight="800">5%</text>

            <rect class="f-paper" x="440" y="304" width="320" height="94" rx="16"/>
            <text x="600" y="344" font-size="18" font-weight="900" text-anchor="middle">힌트만 받으면</text>
            <text class="grey" x="600" y="372" font-size="13.5" text-anchor="middle">끝까지 풀어 보는 힘이 남았어요</text>
            <text class="grey" x="440" y="448" font-size="12">세 번의 실험에 모두 1,222명이 참여했어요</text>
          </svg>
