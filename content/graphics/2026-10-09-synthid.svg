<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">AI 표시가 들어간 사진과 영상 수, 함께 확인되는 회사, 확인하는 순서</title>
            <desc id="g1d">구글은 2023년부터 사진과 영상 1,800억 개가 넘게 눈에 안 보이는 AI 표시를 넣었다. 구글, 오픈AI, 엔비디아, 카카오의 AI가 만든 것을 확인할 수 있고 애플은 곧 함께한다. 파일을 올리면 숨은 표시를 찾아 표시 있음 또는 표시 없음으로 알려 준다. 표시가 없어도 사람이 만들었다는 뜻은 아니다.</desc>
            <text class="num" x="30" y="118" font-size="72" letter-spacing="-3">1,800억 개</text>
            <text x="34" y="156" font-size="16" font-weight="800">AI 표시가 들어간 사진과 영상</text>
            <text class="grey" x="34" y="180" font-size="13.5">구글 발표, 2023년부터 지금까지</text>

            <text x="34" y="250" font-size="16" font-weight="800">함께 확인되는 회사의 AI</text>
            <rect class="f-paper" x="34" y="270" width="80" height="40" rx="20"/>
            <rect class="f-paper" x="122" y="270" width="88" height="40" rx="20"/>
            <rect class="f-paper" x="218" y="270" width="96" height="40" rx="20"/>
            <rect class="f-blue" x="34" y="320" width="80" height="40" rx="20"/>
            <text x="74" y="296" font-size="15" font-weight="800" text-anchor="middle">구글</text>
            <text x="166" y="296" font-size="15" font-weight="800" text-anchor="middle">오픈AI</text>
            <text x="266" y="296" font-size="15" font-weight="800" text-anchor="middle">엔비디아</text>
            <text class="white" x="74" y="346" font-size="15" font-weight="800" text-anchor="middle">카카오</text>
            <text class="grey" x="128" y="346" font-size="13.5">애플은 곧 함께할 예정</text>
            <text class="grey" x="34" y="430" font-size="12">지금은 영어 화면만 있어요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <rect class="f-paper" x="440" y="40" width="320" height="64" rx="16"/>
            <text x="600" y="70" font-size="18" font-weight="900" text-anchor="middle">파일 올리기</text>
            <text class="grey" x="600" y="92" font-size="13.5" text-anchor="middle">사진, 영상, 소리</text>
            <line class="line" x1="600" y1="110" x2="600" y2="132" stroke-width="3"/>
            <path class="f-ink" d="M600 142 l-8 -13 h16z"/>
            <rect class="f-blue" x="440" y="148" width="320" height="64" rx="16"/>
            <text class="white" x="600" y="178" font-size="18" font-weight="900" text-anchor="middle">숨은 표시 찾기</text>
            <text class="white" x="600" y="200" font-size="13.5" text-anchor="middle">눈에는 안 보이는 표시</text>
            <line class="line" x1="520" y1="218" x2="520" y2="240" stroke-width="3"/>
            <path class="f-ink" d="M520 250 l-8 -13 h16z"/>
            <line class="line" x1="680" y1="218" x2="680" y2="240" stroke-width="3"/>
            <path class="f-ink" d="M680 250 l-8 -13 h16z"/>
            <rect class="f-paper" x="440" y="256" width="152" height="84" rx="16"/>
            <rect class="f-paper" x="608" y="256" width="152" height="84" rx="16"/>
            <text x="516" y="292" font-size="18" font-weight="900" text-anchor="middle">표시 있음</text>
            <text class="grey" x="516" y="316" font-size="13.5" text-anchor="middle">AI가 만들었어요</text>
            <text x="684" y="292" font-size="18" font-weight="900" text-anchor="middle">표시 없음</text>
            <text class="grey" x="684" y="316" font-size="13.5" text-anchor="middle">더 알아봐야 해요</text>
            <text class="red" x="440" y="384" font-size="15" font-weight="800">표시가 없어도</text>
            <text class="red" x="440" y="408" font-size="15" font-weight="800">사람이 만들었다는 뜻은 아니에요</text>
          </svg>
