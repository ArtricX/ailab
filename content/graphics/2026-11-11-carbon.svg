<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g2t">제미나이 4 카본의 값과 쓸 수 있는 사람</title>
            <desc id="g2d">구글은 11월 10일 제미나이 4 카본을 널리 열었다. 개발자 값은 11월 30일까지 글자 조각 100만 개를 넣을 때 2달러, 받을 때 10달러다. 그 뒤에는 넣을 때 4달러, 받을 때 20달러로 두 배가 된다. 제미나이 앱과 검색 AI 모드에서는 가장 비싼 요금제인 AI 울트라 구독자가 쓸 수 있다. 과학자는 6개월 무료 사용을 신청할 수 있다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">2배</text>
            <text x="34" y="170" font-size="16" font-weight="800">12월부터 오르는 개발자 값</text>
            <text class="grey" x="34" y="194" font-size="13.5">글자 조각 100만 개당 · 달러 · 구글 발표</text>
            <text x="34" y="236" font-size="14.5" font-weight="800">넣을 때</text>
            <rect class="f-blue" x="110" y="218" width="27" height="26" rx="6"/>
            <text x="147" y="237" font-size="14.5" font-weight="900">2</text>
            <rect class="f-ink" x="110" y="252" width="54" height="26" rx="6"/>
            <text class="red" x="174" y="271" font-size="14.5" font-weight="900">4</text>
            <text x="34" y="320" font-size="14.5" font-weight="800">받을 때</text>
            <rect class="f-blue" x="110" y="302" width="135" height="26" rx="6"/>
            <text x="255" y="321" font-size="14.5" font-weight="900">10</text>
            <rect class="f-ink" x="110" y="336" width="270" height="26" rx="6"/>
            <text class="white" x="360" y="355" font-size="14.5" font-weight="900" text-anchor="end">20</text>
            <rect class="f-blue" x="34" y="392" width="16" height="16" rx="4"/>
            <text x="58" y="405" font-size="13.5" font-weight="700">11월 30일까지</text>
            <rect class="f-ink" x="180" y="392" width="16" height="16" rx="4"/>
            <text x="204" y="405" font-size="13.5" font-weight="700">그 뒤</text>
            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>
            <text x="440" y="56" font-size="15" font-weight="800">누가 쓸 수 있어요?</text>
            <rect class="f-paper" x="440" y="74" width="320" height="44" rx="14"/>
            <text x="600" y="102" font-size="14.5" font-weight="900" text-anchor="middle">AI 울트라 구독자: 제미나이 앱, 검색</text>
            <rect class="f-paper" x="440" y="130" width="320" height="44" rx="14"/>
            <text x="600" y="158" font-size="14.5" font-weight="900" text-anchor="middle">돈을 내는 개발자와 회사</text>
            <rect class="f-paper" x="440" y="186" width="320" height="44" rx="14"/>
            <text x="600" y="214" font-size="14.5" font-weight="900" text-anchor="middle">과학자: 6개월 무료 신청</text>
            <text x="440" y="280" font-size="15" font-weight="800">구글이 말한 쓰임</text>
            <text x="440" y="308" font-size="14.5" font-weight="700">어려운 오류 찾기, 과학 연구처럼</text>
            <text x="440" y="332" font-size="14.5" font-weight="700">오래 생각해야 하는 일</text>
            <text class="grey" x="440" y="372" font-size="13.5">보통 일에는 아르곤이 낫다고 했어요</text>
          </svg>
