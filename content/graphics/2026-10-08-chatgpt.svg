<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">챗GPT 이용자 수, 새 기능이 퍼지는 날짜, 답 모양의 변화</title>
            <desc id="g1d">챗GPT는 매주 12억 명 넘게 쓴다. 새 기능은 미국 시간 10월 7일 유료 요금제부터, 10월 8일 무료와 고 요금제로 넓어진다. 예전 답은 글로만 나왔고, 이제는 버튼, 차트, 지도가 섞여 나온다.</desc>
            <text class="num" x="30" y="122" font-size="92" letter-spacing="-4">12억 명</text>
            <text x="34" y="160" font-size="16" font-weight="800">매주 챗GPT를 쓰는 사람</text>
            <text class="grey" x="34" y="184" font-size="13.5">오픈AI 발표, 12억 명이 넘어요</text>

            <text x="34" y="250" font-size="16" font-weight="800">새 답 모양이 퍼지는 순서</text>
            <line class="line" x1="70" y1="300" x2="320" y2="300" stroke-width="3"/>
            <circle class="f-ink" cx="70" cy="300" r="11"/>
            <circle class="f-red" cx="320" cy="300" r="11"/>
            <text class="num" x="70" y="346" font-size="22" text-anchor="middle">10월 7일</text>
            <text x="70" y="372" font-size="14" text-anchor="middle">유료 요금제</text>
            <text class="num red" x="320" y="346" font-size="22" text-anchor="middle">10월 8일</text>
            <text x="320" y="372" font-size="14" text-anchor="middle">무료·고 요금제</text>
            <text class="grey" x="34" y="430" font-size="12">미국 시간 기준, 이용자마다 차례로 열려요</text>

