<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">AI로 심장 사진을 읽은 시험 결과</title>
            <desc id="g1d">미국심장협회 학술대회에서 미국 시간 11월 7일 발표된 중간 결과다. 가슴 통증이 있는 환자 530명을 21곳 병원에서 두 쪽으로 나눴다. AI로 심장 혈관 사진을 읽은 쪽은 콜레스테롤을 낮추는 치료를 받는 사람이 검사 전 31%에서 검사 뒤 75%로 늘었다. 보통 검사를 한 쪽은 32%에서 47%로 늘었다. 180일 뒤 결과를 비교했다. 전문가 심사 전의 중간 결과이고, 심장마비가 줄었는지는 따로 밝혀지지 않았다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">75%</text>
            <text x="34" y="170" font-size="16" font-weight="800">콜레스테롤 낮추는 치료를 받는 비율</text>
            <text class="grey" x="34" y="194" font-size="13.5">AI로 심장 사진을 읽은 쪽 · 검사 뒤</text>
            <rect class="f-pink" x="34" y="222" width="150" height="44" rx="14"/>
            <text x="109" y="250" font-size="14.5" font-weight="900" text-anchor="middle">환자 530명</text>
            <rect class="f-paper" x="204" y="222" width="150" height="44" rx="14"/>
            <text x="279" y="250" font-size="14.5" font-weight="900" text-anchor="middle">병원 21곳</text>
            <text x="34" y="306" font-size="14.5" font-weight="700">180일 뒤에 두 쪽을 비교했어요</text>
            <text x="34" y="330" font-size="14.5" font-weight="700">다른 쪽은 보통 하는 심장 검사예요</text>
            <text class="red" x="34" y="370" font-size="14.5" font-weight="900">아직 전문가 심사 전의 중간 결과예요</text>
            <text class="grey" x="34" y="420" font-size="13.5">심장마비가 줄었는지는 아직 몰라요</text>
            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>
            <text x="440" y="56" font-size="15" font-weight="800">치료받는 사람의 비율</text>
            <text x="440" y="92" font-size="14.5" font-weight="800">AI로 사진을 읽은 쪽</text>
            <rect class="f-paper" x="440" y="104" width="99.2" height="26" rx="6"/>
            <text x="549.2" y="123" font-size="14.5" font-weight="900">검사 전 31%</text>
            <rect class="f-pink" x="440" y="136" width="240" height="26" rx="6"/>
            <text x="690" y="155" font-size="14.5" font-weight="900">검사 뒤 75%</text>
            <text x="440" y="196" font-size="14.5" font-weight="800">보통 검사를 한 쪽</text>
            <rect class="f-paper" x="440" y="208" width="102.4" height="26" rx="6"/>
            <text x="552.4" y="227" font-size="14.5" font-weight="900">검사 전 32%</text>
            <rect class="f-paper" x="440" y="240" width="150.4" height="26" rx="6"/>
            <text x="600.4" y="259" font-size="14.5" font-weight="900">검사 뒤 47%</text>
            <text x="440" y="306" font-size="15" font-weight="800">쉽게 말하면</text>
            <text x="440" y="334" font-size="14.5" font-weight="700">AI가 혈관 속 찌꺼기를 재어 보니</text>
            <text x="440" y="358" font-size="14.5" font-weight="700">치료를 시작하는 사람이 더 늘었어요</text>
          </svg>
