<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="400" fill="#EDEEF0"/>
            <title id="g3t">말로 게임을 만드는 순서와 쓸 수 있는 사람</title>
            <desc id="g3d">채팅으로 만들고 싶은 게임을 설명하고, 2D나 3D 모양을 고르고, 두 번 뛰기처럼 바꾸고 싶은 점을 말로 고친 뒤, 링크나 모음으로 친구와 나눈다. 지금은 미국에 사는 18세 이상만 쓸 수 있다.</desc>
            <g>
              <line class="line" x1="176" y1="122" x2="226" y2="122" stroke-width="3"/>
              <path class="f-ink" d="M236 122 l-14 -8 v16z"/>
              <line class="line" x1="366" y1="122" x2="416" y2="122" stroke-width="3"/>
              <path class="f-ink" d="M426 122 l-14 -8 v16z"/>
              <line class="line" x1="556" y1="122" x2="606" y2="122" stroke-width="3"/>
              <path class="f-ink" d="M616 122 l-14 -8 v16z"/>
            </g>
            <circle class="f-paper" cx="110" cy="122" r="62"/>
            <circle class="f-blue" cx="300" cy="122" r="62"/>
            <circle class="f-green" cx="490" cy="122" r="62"/>
            <circle class="f-yellow" cx="680" cy="122" r="62"/>
            <text x="110" y="129" font-size="20" font-weight="900" text-anchor="middle">말로 설명</text>
            <text class="white" x="300" y="129" font-size="20" font-weight="900" text-anchor="middle">모양 고르기</text>
            <text x="490" y="129" font-size="20" font-weight="900" text-anchor="middle">말로 고치기</text>
            <text x="680" y="129" font-size="20" font-weight="900" text-anchor="middle">함께 나누기</text>

            <text x="110" y="218" font-size="14" text-anchor="middle">어떤 게임인지</text>
            <text x="110" y="240" font-size="14" text-anchor="middle">채팅으로 적어요</text>
            <text x="300" y="218" font-size="14" text-anchor="middle">2D나 3D,</text>
            <text x="300" y="240" font-size="14" text-anchor="middle">혼자나 여럿이</text>
            <text x="490" y="218" font-size="14" text-anchor="middle">두 번 뛰기처럼</text>
            <text x="490" y="240" font-size="14" text-anchor="middle">규칙을 바꿔요</text>
            <text x="680" y="218" font-size="14" text-anchor="middle">링크로 보내거나</text>
            <text x="680" y="240" font-size="14" text-anchor="middle">모음에 올려요</text>

            <line class="line-grey" x1="40" y1="282" x2="760" y2="282" stroke-width="2"/>
            <text class="num" x="40" y="368" font-size="76" letter-spacing="-3">18세+</text>
            <text x="300" y="334" font-size="17" font-weight="900">지금 쓸 수 있는 사람</text>
            <text x="300" y="362" font-size="15"><tspan class="red" font-weight="800">미국</tspan>에 사는 18세 이상만, 실험 단계예요.</text>
          </svg>
