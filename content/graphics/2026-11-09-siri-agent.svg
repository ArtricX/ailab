<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g2t">애플 시리 변화에 대한 보도</title>
            <desc id="g2d">미국 블룸버그의 11월 8일 보도를 여러 정보기술 매체가 전했다. 애플은 이르면 2027년에 시리를 더 비서처럼 바꿀 수 있다. 지금 시리는 부탁을 받으면 그때그때 일하지만, 앞으로는 목표를 기억하고 다음 할 일을 알아서 찾게 하려 한다는 내용이다. 다음 아이폰 운영체제를 만드는 첫 단계에서는 프로그램 짜는 시간이 보통 4주에서 6주로 늘어난다. 애플의 공식 발표는 없다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">2027년</text>
            <text x="34" y="170" font-size="16" font-weight="800">이르면 시리가 비서처럼 바뀐다는 보도</text>
            <text class="grey" x="34" y="194" font-size="13.5">블룸버그 보도를 여러 매체가 전함 · 11월 8일</text>
            <rect class="f-paper" x="34" y="222" width="320" height="44" rx="14"/>
            <text x="194" y="250" font-size="14.5" font-weight="900" text-anchor="middle">지금: 부탁하면 그때그때 해요</text>
            <line class="line" x1="194" y1="270" x2="194" y2="278" stroke-width="3"/>
            <path class="f-ink" d="M186 278L202 278L194 288Z"/>
            <rect class="f-blue" x="34" y="292" width="320" height="44" rx="14"/>
            <text class="white" x="194" y="320" font-size="14.5" font-weight="900" text-anchor="middle">보도: 목표를 기억하고 알아서 해요</text>
            <text class="red" x="34" y="380" font-size="14.5" font-weight="900">애플의 공식 발표는 아직 없어요</text>
            <text class="grey" x="34" y="420" font-size="13.5">우리나라 일정도 알려지지 않았어요</text>
            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>
            <text x="440" y="56" font-size="15" font-weight="800">개발 첫 단계에 프로그램 짜는 시간</text>
            <text x="440" y="92" font-size="14.5" font-weight="800">보통</text>
            <rect class="f-paper" x="440" y="104" width="213.333" height="26" rx="6"/>
            <text x="663.333" y="123" font-size="14.5" font-weight="900">4주</text>
            <text x="440" y="164" font-size="14.5" font-weight="800">다음 기본 프로그램</text>
            <rect class="f-blue" x="440" y="176" width="320" height="26" rx="6"/>
            <text class="white" x="600" y="195" font-size="14.5" font-weight="900" text-anchor="middle">6주</text>
            <text x="440" y="262" font-size="15" font-weight="800">왜 시간을 늘리나요?</text>
            <text x="440" y="290" font-size="14.5" font-weight="700">프로그램 짜기를 돕는 AI가 좋아져서</text>
            <text x="440" y="314" font-size="14.5" font-weight="700">새 기능을 만들 시간을 늘린대요</text>
            <text class="grey" x="440" y="404" font-size="13.5">보도 내용이에요</text>
          </svg>
