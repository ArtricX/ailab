<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g2t">도어대시의 석 달 주문 수와 AI 비서가 대신 낸 주문 수</title>
            <desc id="g2d">미국 배달 회사 도어대시는 10월 29일(미국 시간) 실적 발표에서 올해 7월부터 9월까지 석 달 동안 주문이 약 9억 9,300만 건이었다고 밝혔다. 최고경영자는 다른 회사의 AI 비서가 대신 낸 주문이 지금까지 모두 합쳐 수백 건 정도라고 말했다. 대부분의 사람은 도어대시 앱으로 직접 주문한다. 도어대시는 앞으로 AI 비서 안에 광고를 넣을 기회도 있다고 봤다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">수백 건</text>
            <text x="34" y="170" font-size="16" font-weight="800">AI 비서가 대신 낸 주문, 모두 합쳐</text>
            <text class="grey" x="34" y="194" font-size="13.5">도어대시 · 10월 29일 실적 발표 (미국 시간)</text>

            <text x="34" y="236" font-size="14" font-weight="800">석 달 동안 모든 주문 약 9억 9,300만 건</text>
            <rect class="f-paper" x="34" y="248" width="320" height="40" rx="12"/>
            <text x="34" y="324" font-size="14" font-weight="800">AI 비서 주문 (너무 적어 거의 안 보여요)</text>
            <rect class="f-red" x="34" y="336" width="4" height="40" rx="2"/>
            <text x="34" y="414" font-size="15" font-weight="900">대부분은 앱으로 직접 시켜요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">AI 비서 주문은 이렇게 돼요</text>
            <rect class="f-paper" x="440" y="74" width="320" height="48" rx="16"/>
            <text x="600" y="104" font-size="14.5" font-weight="900" text-anchor="middle">AI에게 먹고 싶은 걸 말해요</text>
            <line class="line" x1="600" y1="126" x2="600" y2="136" stroke-width="3"/>
            <path class="f-ink" d="M600 146 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="150" width="320" height="48" rx="16"/>
            <text x="600" y="180" font-size="14.5" font-weight="900" text-anchor="middle">AI가 가게와 음식을 골라요</text>
            <line class="line" x1="600" y1="202" x2="600" y2="212" stroke-width="3"/>
            <path class="f-ink" d="M600 222 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="226" width="320" height="48" rx="16"/>
            <text x="600" y="256" font-size="14.5" font-weight="900" text-anchor="middle">대신 주문을 넣어요</text>

            <text x="440" y="318" font-size="15" font-weight="800">회사가 보는 앞날</text>
            <text x="440" y="346" font-size="14.5" font-weight="700">AI 비서와 더 가까워지려 해요</text>
            <text x="440" y="370" font-size="14.5" font-weight="700">AI 비서 안 광고도 생각해요</text>
            <text x="440" y="414" font-size="14.5" font-weight="900">아직은 쓰는 사람이 적어요</text>
          </svg>
