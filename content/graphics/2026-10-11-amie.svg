<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="470" fill="#EDEEF0"/>
            <title id="g3t">AI가 꼽은 병 후보 안에 실제 진단이 들어 있던 비율과 연구 순서</title>
            <desc id="g3d">AI가 꼽은 병 후보 7개 안에 실제 진단이 들어 있던 경우가 90%, 후보 3개 안에는 75%, 첫 번째 후보가 맞은 경우는 56%였다. 환자는 진료 5일 전까지 집에서 AI와 글로 대화했고, 의사가 모든 대화를 실시간으로 지켜봤으며, AI가 쓴 요약을 의사가 보고 진료했다. AI가 지어낸 내용이 한 번 있었고 지켜보던 의사가 찾아냈다. 미국 보스턴의 병원 한 곳에서 환자 98명이 참여했다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">90%</text>
            <text x="34" y="170" font-size="16" font-weight="800">AI가 꼽은 후보 7개 안에 실제 진단</text>
            <text class="grey" x="34" y="194" font-size="13.5">8주 뒤 진료 기록과 견주어 봤어요</text>

            <text class="grey" x="34" y="240" font-size="12.5">후보 7개 안</text>
            <rect class="f-green" x="34" y="250" width="270" height="30" rx="10"/>
            <text x="314" y="272" font-size="14" font-weight="800">90%</text>
            <text class="grey" x="34" y="306" font-size="12.5">후보 3개 안</text>
            <rect class="f-green" x="34" y="316" width="225" height="30" rx="10"/>
            <text x="269" y="338" font-size="14" font-weight="800">75%</text>
            <text class="grey" x="34" y="372" font-size="12.5">첫 번째 후보</text>
            <rect class="f-green" x="34" y="382" width="168" height="30" rx="10"/>
            <text x="212" y="404" font-size="14" font-weight="800">56%</text>
            <text class="grey" x="34" y="450" font-size="12">미국 보스턴의 병원 한 곳, 환자 98명</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="450" stroke-width="2"/>

            <rect class="f-paper" x="440" y="30" width="320" height="84" rx="16"/>
            <text x="600" y="66" font-size="18" font-weight="900" text-anchor="middle">집에서 AI와 대화</text>
            <text class="grey" x="600" y="92" font-size="13.5" text-anchor="middle">진료 5일 전까지, 글로 나눠요</text>
            <line class="line" x1="600" y1="120" x2="600" y2="140" stroke-width="3"/>
            <path class="f-ink" d="M600 150 l-8 -13 h16z"/>
            <rect class="f-green" x="440" y="156" width="320" height="94" rx="16"/>
            <text class="white" x="600" y="196" font-size="18" font-weight="900" text-anchor="middle">의사가 모두 지켜봐요</text>
            <text class="white" x="600" y="224" font-size="13.5" text-anchor="middle">대화마다 실시간으로</text>
            <line class="line" x1="600" y1="256" x2="600" y2="276" stroke-width="3"/>
            <path class="f-ink" d="M600 286 l-8 -13 h16z"/>
            <rect class="f-paper" x="440" y="292" width="320" height="84" rx="16"/>
            <text x="600" y="328" font-size="18" font-weight="900" text-anchor="middle">요약을 보고 진료</text>
            <text class="grey" x="600" y="354" font-size="13.5" text-anchor="middle">진료는 사람 의사가 해요</text>
            <text class="red" x="600" y="420" font-size="14" font-weight="800" text-anchor="middle">AI가 지어낸 내용 1번, 의사가 잡아냈어요</text>
          </svg>
