<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g2t">캔바 크래프트가 처음 받은 순위와 그림을 그리는 순서</title>
            <desc id="g2d">캔바가 10월 22일(미국 시간) 처음으로 직접 만든 그림 AI '캔바 크래프트'를 내놓았다. 디자인 그림 AI를 견주는 '디자인 아레나' 순위에서 4위로 시작했다고 회사가 밝혔다. 1위부터 3위는 모두 오픈AI의 모델이다. 그리는 순서는 글로 설명하면, 글자와 그림의 자리를 먼저 계획하고, 그다음 그림을 그린다. 그림은 최대 2K 크기, 30가지 비율로 만든다. 사람이 만든 디자인 틀 수백만 개로 배웠다고 회사가 밝혔다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">4위</text>
            <text x="34" y="170" font-size="16" font-weight="800">디자인 그림 AI 순위</text>
            <text class="grey" x="34" y="194" font-size="13.5">디자인 아레나 · 회사가 밝힌 순위</text>

            <rect class="f-paper" x="34" y="226" width="320" height="44" rx="16"/>
            <text x="54" y="254" font-size="14.5" font-weight="900">1위 · 오픈AI 모델</text>
            <rect class="f-paper" x="34" y="278" width="320" height="44" rx="16"/>
            <text x="54" y="306" font-size="14.5" font-weight="900">2위 · 오픈AI 모델</text>
            <rect class="f-paper" x="34" y="330" width="320" height="44" rx="16"/>
            <text x="54" y="358" font-size="14.5" font-weight="900">3위 · 오픈AI 모델</text>
            <rect class="f-pink" x="34" y="382" width="320" height="44" rx="16"/>
            <text x="54" y="410" font-size="14.5" font-weight="900">4위 · 캔바 크래프트</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">그림을 그리는 순서</text>
            <rect class="f-paper" x="440" y="74" width="320" height="48" rx="16"/>
            <text x="600" y="104" font-size="14.5" font-weight="900" text-anchor="middle">만들 그림을 글로 설명해요</text>
            <line class="line" x1="600" y1="126" x2="600" y2="136" stroke-width="3"/>
            <path class="f-ink" d="M600 146 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="150" width="320" height="48" rx="16"/>
            <text x="600" y="180" font-size="14.5" font-weight="900" text-anchor="middle">글자와 그림 자리를 먼저 정해요</text>
            <line class="line" x1="600" y1="202" x2="600" y2="212" stroke-width="3"/>
            <path class="f-ink" d="M600 222 l-8 -12 h16z"/>
            <rect class="f-pink" x="440" y="226" width="320" height="48" rx="16"/>
            <text x="600" y="256" font-size="14.5" font-weight="900" text-anchor="middle">그다음에 그림을 그려요</text>

            <text x="440" y="318" font-size="15" font-weight="800">만들 수 있는 그림</text>
            <text x="440" y="346" font-size="14.5" font-weight="700">최대 2K 크기 · 30가지 비율</text>
            <text class="grey" x="440" y="372" font-size="12.5">포스터, 메뉴판, 안내문 같은 디자인</text>
            <text class="red" x="440" y="412" font-size="14.5" font-weight="900">AI가 넣은 글자는 다시 읽어요</text>
          </svg>
