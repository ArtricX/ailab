<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">클로드의 새 기능 개인 금융</title>
            <desc id="g1d">앤트로픽은 미국 시간 11월 5일, AI 클로드에 은행 계좌를 이어 지출을 정리해 주는 개인 금융 기능을 시험판으로 내놓았다. 클로드는 최근 2년 동안의 거래 내역을 읽을 수 있다. 할 수 있는 일은 지출 정리와 겹친 결제나 수수료 찾기이고, 돈을 옮기거나 투자하는 일은 할 수 없다. 오른쪽은 이용 순서다. 은행에 직접 로그인해 읽기만 허락하면, 클로드가 잔액과 거래 내역을 읽고, 한 달 지출을 정리하거나 질문에 답한다. 연결은 언제든 끊을 수 있다. 지금은 미국의 유료 이용자만 쓸 수 있다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">2년</text>
            <text x="34" y="170" font-size="16" font-weight="800">AI가 읽을 수 있는 거래 내역</text>
            <text class="grey" x="34" y="194" font-size="13.5">앤트로픽 · 미국 시간 11월 5일 발표</text>

            <rect class="f-green" x="34" y="222" width="320" height="44" rx="14"/>
            <text x="54" y="250" font-size="14.5" font-weight="900">할 수 있어요: 지출 정리, 질문에 답하기</text>
            <rect class="f-paper" x="34" y="278" width="320" height="44" rx="14"/>
            <text x="54" y="306" font-size="14.5" font-weight="900">할 수 있어요: 겹친 결제·수수료 찾기</text>
            <rect class="f-ink" x="34" y="334" width="320" height="44" rx="14"/>
            <text class="white" x="54" y="362" font-size="14.5" font-weight="900">못 해요: 돈 옮기기, 투자하기</text>
            <text class="grey" x="34" y="420" font-size="13.5">지금은 미국 유료 이용자만 써요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">이렇게 써요</text>
            <rect class="f-paper" x="440" y="74" width="320" height="44" rx="14"/>
            <text x="600" y="102" font-size="14.5" font-weight="900" text-anchor="middle">은행에 직접 로그인해 허락해요</text>
            <line class="line" x1="600" y1="122" x2="600" y2="130" stroke-width="3"/>
            <path class="f-ink" d="M600 140 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="144" width="320" height="44" rx="14"/>
            <text x="600" y="172" font-size="14.5" font-weight="900" text-anchor="middle">AI가 잔액과 거래 내역을 읽어요</text>
            <line class="line" x1="600" y1="192" x2="600" y2="200" stroke-width="3"/>
            <path class="f-ink" d="M600 210 l-8 -12 h16z"/>
            <rect class="f-green" x="440" y="214" width="320" height="44" rx="14"/>
            <text x="600" y="242" font-size="14.5" font-weight="900" text-anchor="middle">한 달 지출을 정리해 보여 줘요</text>

            <text x="440" y="300" font-size="15" font-weight="800">알아 두세요</text>
            <text class="red" x="440" y="328" font-size="14.5" font-weight="900">AI는 은행 비밀번호를 보지 않아요</text>
            <text x="440" y="352" font-size="14.5" font-weight="700">연결은 언제든 끊을 수 있어요</text>
            <text class="grey" x="440" y="404" font-size="13.5">시험판(베타)으로 먼저 열렸어요</text>
          </svg>
