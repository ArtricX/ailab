<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="400" fill="#EDEEF0"/>
            <title id="g2t">시의회와 AI 회사 네 곳의 입장</title>
            <desc id="g2d">뉴욕 시의회는 완벽이 아니라 책임, 투명성, 안전을 바랐고, 오픈AI, 앤트로픽, 구글, 메타는 위험이 전혀 없다는 100% 약속은 할 수 없다고 답했다.</desc>
            <text class="grey" x="400" y="40" font-size="13.5" text-anchor="middle">10월 5일, 미국 뉴욕 시의회 회의</text>

            <path class="f-blue" d="M48 70 h196 q24 0 24 24 v122 q0 24 -24 24 h-120 l-34 34 l6 -34 h-48 q-24 0 -24 -24 v-122 q0 -24 24 -24z"/>
            <text class="white" x="48" y="112" font-size="19" font-weight="900">뉴욕 시의회</text>
            <text class="white" x="48" y="152" font-size="15">완벽은 바라지 않아요.</text>
            <text class="white" x="48" y="180" font-size="15">책임지고, 투명하게,</text>
            <text class="white" x="48" y="208" font-size="15">안전하게 해 주세요.</text>

            <path class="f-yellow" d="M556 70 h196 q24 0 24 24 v122 q0 24 -24 24 h-48 l6 34 l-34 -34 h-120 q-24 0 -24 -24 v-122 q0 -24 24 -24z"/>
            <text x="556" y="112" font-size="19" font-weight="900">AI 회사 네 곳</text>
            <text x="556" y="152" font-size="15">위험이 전혀 없다고는</text>
            <text x="556" y="180" font-size="15">약속할 수 없어요.</text>
            <text x="556" y="208" font-size="15">아직 어려운 과제예요.</text>

            <text class="num" x="400" y="190" font-size="78" text-anchor="middle" letter-spacing="-3">100%</text>
            <line class="line-red" x1="286" y1="226" x2="514" y2="112" stroke-width="10" stroke-linecap="round"/>
            <text x="400" y="252" font-size="14" font-weight="700" text-anchor="middle">위험 0% 약속은 없었어요</text>

            <text class="grey" x="400" y="306" font-size="13" text-anchor="middle">회의에 나온 회사</text>
            <rect class="f-paper" x="50" y="324" width="160" height="46" rx="23"/>
            <rect class="f-paper" x="230" y="324" width="160" height="46" rx="23"/>
            <rect class="f-paper" x="410" y="324" width="160" height="46" rx="23"/>
            <rect class="f-paper" x="590" y="324" width="160" height="46" rx="23"/>
            <text x="130" y="353" font-size="16" font-weight="800" text-anchor="middle">오픈AI</text>
            <text x="310" y="353" font-size="16" font-weight="800" text-anchor="middle">앤트로픽</text>
            <text x="490" y="353" font-size="16" font-weight="800" text-anchor="middle">구글</text>
            <text x="670" y="353" font-size="16" font-weight="800" text-anchor="middle">메타</text>
          </svg>
