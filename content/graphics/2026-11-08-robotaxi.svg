<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g3t">테슬라 공장의 생산 계획 변화</title>
            <desc id="g3d">테슬라의 일론 머스크 대표는 미국 시간 11월 6일, 픽업트럭 사이버트럭 생산을 2027년 중반쯤 끝낸다고 밝혔다. 그 자리에서는 AI가 스스로 운전하는 로봇택시 사이버캡을 만든다. 사이버캡에는 운전대와 페달이 없다. 오른쪽은 로봇택시를 타는 순서다. 앱으로 부르면, 차가 스스로 와서, 목적지까지 데려다준다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">2027년</text>
            <text x="34" y="170" font-size="16" font-weight="800">중반쯤 사이버트럭 생산을 끝내요</text>
            <text class="grey" x="34" y="194" font-size="13.5">테슬라 · 미국 시간 11월 6일</text>

            <rect class="f-paper" x="34" y="222" width="320" height="44" rx="14"/>
            <text x="194" y="250" font-size="14.5" font-weight="900" text-anchor="middle">지금: 사람이 모는 픽업트럭</text>
            <line class="line" x1="194" y1="270" x2="194" y2="278" stroke-width="3"/>
            <path class="f-ink" d="M194 288 l-8 -12 h16z"/>
            <rect class="f-green" x="34" y="292" width="320" height="44" rx="14"/>
            <text x="194" y="320" font-size="14.5" font-weight="900" text-anchor="middle">앞으로: AI가 모는 로봇택시</text>
            <text class="red" x="34" y="380" font-size="14.5" font-weight="900">운전대와 페달이 없어요</text>
            <text class="grey" x="34" y="420" font-size="13.5">같은 공장 자리를 바꿔 써요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">로봇택시는 이렇게 타요</text>
            <rect class="f-paper" x="440" y="74" width="320" height="44" rx="14"/>
            <text x="600" y="102" font-size="14.5" font-weight="900" text-anchor="middle">휴대폰 앱으로 불러요</text>
            <line class="line" x1="600" y1="122" x2="600" y2="130" stroke-width="3"/>
            <path class="f-ink" d="M600 140 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="144" width="320" height="44" rx="14"/>
            <text x="600" y="172" font-size="14.5" font-weight="900" text-anchor="middle">차가 혼자 운전해서 와요</text>
            <line class="line" x1="600" y1="192" x2="600" y2="200" stroke-width="3"/>
            <path class="f-ink" d="M600 210 l-8 -12 h16z"/>
            <rect class="f-green" x="440" y="214" width="320" height="44" rx="14"/>
            <text x="600" y="242" font-size="14.5" font-weight="900" text-anchor="middle">목적지까지 데려다줘요</text>

            <text x="440" y="300" font-size="15" font-weight="800">알아 두세요</text>
            <text x="440" y="328" font-size="14.5" font-weight="700">우리나라에서 탈 수 있는 계획은</text>
            <text x="440" y="352" font-size="14.5" font-weight="700">아직 발표되지 않았어요</text>
          </svg>
