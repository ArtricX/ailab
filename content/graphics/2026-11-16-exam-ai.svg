<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g2t">AI로 시험 부정행위를 하면 받는 벌과 정부의 대책 5가지</title>
            <desc id="g2d">올해 제63회 세무사 시험에서 생성형 AI를 쓴 부정행위가 드러나자, 청와대와 고용노동부, 한국산업인력공단은 11월 15일 대책 회의를 열었다. 해당 시험은 무효로 하고 합격을 취소하며 고발하고, 5년 동안 시험을 볼 수 없게 한다. 앞으로는 올해 치른 국가자격시험을 모두 다시 살피고, 온라인과 오프라인 제보센터를 열고, 전파탐지기를 들여오고, 스마트 안경 같은 기기 금지와 처벌 안내를 강화하고, 감독관 교육을 늘린다. 연말까지 종합 대책을 낸다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">5년</text>
            <text x="34" y="170" font-size="16" font-weight="800">시험을 볼 수 없는 기간</text>
            <text class="grey" x="34" y="194" font-size="13.5">정부 대책 회의 · 11월 15일</text>
            <text x="34" y="240" font-size="15" font-weight="800">들키면 이렇게 돼요</text>
            <rect class="f-paper" x="34" y="256" width="320" height="40" rx="14"/>
            <text x="194" y="282" font-size="14.5" font-weight="900" text-anchor="middle">시험 무효, 합격 취소</text>
            <line class="line" x1="194" y1="298" x2="194" y2="308" stroke-width="3"/>
            <path class="f-ink" d="M186 308L202 308L194 318Z"/>
            <rect class="f-paper" x="34" y="322" width="320" height="40" rx="14"/>
            <text x="194" y="348" font-size="14.5" font-weight="900" text-anchor="middle">경찰에 고발</text>
            <line class="line" x1="194" y1="364" x2="194" y2="374" stroke-width="3"/>
            <path class="f-ink" d="M186 374L202 374L194 384Z"/>
            <rect class="f-blue" x="34" y="388" width="320" height="40" rx="14"/>
            <text class="white" x="194" y="414" font-size="14.5" font-weight="900" text-anchor="middle">5년 동안 시험 금지</text>
            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>
            <text x="440" y="56" font-size="15" font-weight="800">앞으로 이렇게 막아요</text>
            <rect class="f-red" x="440" y="74" width="320" height="44" rx="14"/>
            <text class="white" x="600" y="102" font-size="14.5" font-weight="900" text-anchor="middle">올해 국가자격시험 모두 다시 봐요</text>
            <rect class="f-paper" x="440" y="128" width="320" height="44" rx="14"/>
            <text x="600" y="156" font-size="14.5" font-weight="900" text-anchor="middle">신고 받는 제보센터를 열어요</text>
            <rect class="f-paper" x="440" y="182" width="320" height="44" rx="14"/>
            <text x="600" y="210" font-size="14.5" font-weight="900" text-anchor="middle">전파탐지기를 들여와요</text>
            <rect class="f-paper" x="440" y="236" width="320" height="44" rx="14"/>
            <text x="600" y="264" font-size="14.5" font-weight="900" text-anchor="middle">스마트 기기 금지를 강화해요</text>
            <rect class="f-paper" x="440" y="290" width="320" height="44" rx="14"/>
            <text x="600" y="318" font-size="14.5" font-weight="900" text-anchor="middle">감독관 교육을 늘려요</text>
            <text x="440" y="384" font-size="14.5" font-weight="700">연말까지 종합 대책을 내요</text>
            <text class="grey" x="440" y="410" font-size="13.5">고용노동부 · 한국산업인력공단</text>
          </svg>
