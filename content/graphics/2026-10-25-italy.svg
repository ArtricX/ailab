<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g2t">이탈리아 새 법령에서 사람이 마지막에 정해야 하는 일과 직원이 물을 수 있는 것</title>
            <desc id="g2d">이탈리아의 법령 179호가 10월 23일부터 시행됐다. 회사가 AI를 쓰더라도 직원을 뽑기, 평가, 징계, 해고의 마지막 결정은 진짜 판단할 힘이 있는 사람이 해야 한다. 이력서를 추리는 일에는 AI를 써도 된다. 직원은 결정에 대해 AI가 얼마나 영향을 줬는지, 무엇을 주로 봤는지, 사람은 무엇을 했는지 설명해 달라고 할 수 있다. 이 규칙을 어긴 결정은 무효가 된다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">4가지</text>
            <text x="34" y="170" font-size="16" font-weight="800">사람이 마지막에 정하는 일</text>
            <text class="grey" x="34" y="194" font-size="13.5">이탈리아 법령 179호 · 10월 23일 시행</text>

            <rect class="f-paper" x="34" y="226" width="154" height="64" rx="16"/>
            <text x="111" y="264" font-size="15" font-weight="900" text-anchor="middle">뽑기</text>
            <rect class="f-paper" x="200" y="226" width="154" height="64" rx="16"/>
            <text x="277" y="264" font-size="15" font-weight="900" text-anchor="middle">평가</text>
            <rect class="f-paper" x="34" y="302" width="154" height="64" rx="16"/>
            <text x="111" y="340" font-size="15" font-weight="900" text-anchor="middle">징계</text>
            <rect class="f-green" x="200" y="302" width="154" height="64" rx="16"/>
            <text x="277" y="340" font-size="15" font-weight="900" text-anchor="middle">해고</text>
            <text class="grey" x="34" y="404" font-size="12.5">이력서를 추리는 일은</text>
            <text class="grey" x="34" y="426" font-size="12.5">AI가 도와도 돼요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">직원이 물어볼 수 있는 것</text>
            <rect class="f-paper" x="440" y="74" width="320" height="56" rx="16"/>
            <text x="600" y="108" font-size="14.5" font-weight="900" text-anchor="middle">AI가 얼마나 영향을 줬나요?</text>
            <rect class="f-paper" x="440" y="142" width="320" height="56" rx="16"/>
            <text x="600" y="176" font-size="14.5" font-weight="900" text-anchor="middle">무엇을 주로 봤나요?</text>
            <rect class="f-green" x="440" y="210" width="320" height="56" rx="16"/>
            <text x="600" y="244" font-size="14.5" font-weight="900" text-anchor="middle">사람은 무엇을 했나요?</text>

            <text x="440" y="312" font-size="15" font-weight="800">이런 사람이 정해야 해요</text>
            <text x="440" y="340" font-size="14.5" font-weight="700">도장만 찍는 사람 말고</text>
            <text x="440" y="364" font-size="14.5" font-weight="700">진짜로 판단할 힘이 있는 사람</text>
            <text class="red" x="440" y="412" font-size="14.5" font-weight="900">어기면 그 결정은 무효예요</text>
          </svg>
