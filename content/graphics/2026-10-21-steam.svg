<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">스팀 넥스트 페스트 시험판 게임 가운데 AI를 썼다고 밝힌 게임의 수와 스팀의 규칙</title>
            <desc id="g1d">게임 가게 스팀이 10월 19일부터 26일까지 여는 무료 시험판 게임 축제 넥스트 페스트에 시험판 게임 8,202개가 나왔다. 작년보다 2배 넘게 많다. 엔가젯 집계로는 이 가운데 1,704개가 생성형 AI를 썼다고 밝혔다. 5개 중 1개꼴이다. 막대는 0부터 8,202개를 기준으로 그렸다. 스팀은 2024년부터 AI를 쓴 게임은 그 사실을 밝히게 하고, 가게 페이지 맨 아래에 표시한다. 하지만 AI를 쓴 게임만 걸러 보는 기능은 없다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">1,704개</text>
            <text x="34" y="170" font-size="16" font-weight="800">AI를 썼다고 밝힌 시험판 게임</text>
            <text class="grey" x="34" y="194" font-size="13.5">엔가젯 집계 · 5개 중 1개꼴이에요</text>

            <text x="34" y="240" font-size="13.5" font-weight="800">전체 시험판 게임 · 8,202개</text>
            <rect class="f-paper" x="34" y="250" width="320" height="30" rx="8"/>
            <text x="34" y="314" font-size="13.5" font-weight="800">AI를 썼다고 밝힌 게임 · 1,704개</text>
            <rect class="f-yellow" x="34" y="324" width="66" height="30" rx="8"/>
            <text x="34" y="392" font-size="13.5" font-weight="700">전체 수는 작년보다</text>
            <text x="34" y="414" font-size="13.5" font-weight="700">2배 넘게 늘었어요</text>
            <text class="grey" x="34" y="444" font-size="12.5">막대는 0부터 8,202개를 기준으로 그렸어요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">축제 기간</text>
            <rect class="f-yellow" x="440" y="74" width="320" height="52" rx="16"/>
            <text x="600" y="106" font-size="14.5" font-weight="900" text-anchor="middle">10월 19일 → 10월 26일</text>

            <text x="440" y="176" font-size="15" font-weight="800">스팀의 규칙</text>
            <rect class="f-paper" x="440" y="194" width="320" height="52" rx="16"/>
            <text x="460" y="226" font-size="14.5" font-weight="900">AI를 썼으면 밝혀야 해요</text>
            <rect class="f-paper" x="440" y="256" width="320" height="52" rx="16"/>
            <text x="460" y="288" font-size="14.5" font-weight="900">가게 페이지 맨 아래에 보여요</text>
            <rect class="f-paper" x="440" y="318" width="320" height="52" rx="16"/>
            <text class="red" x="460" y="350" font-size="14.5" font-weight="900">AI 게임만 걸러 보진 못해요</text>
            <text class="grey" x="440" y="402" font-size="12.5">밝히는 규칙은 2024년부터 있었어요</text>
            <text class="grey" x="440" y="424" font-size="12.5">스팀은 만든 사람의 말을 믿고 표시해요</text>
          </svg>
