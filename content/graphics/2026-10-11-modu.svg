<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">'모두의 AI' 기본 기능 이용료와 세 회사의 서비스, 출시 일정</title>
            <desc id="g1d">기본 기능은 0원, 무료로 쓸 수 있다. SK텔레콤은 전화로 대신 예약하고, 카카오는 카카오톡 안에서 예약과 결제를 돕고, KT는 검색과 비교를 대화 한 번에 해 준다. 10월에 시험판을 열고, 12월에 정식으로 문을 열며, 내년에는 한 사람에 AI 비서 하나를 목표로 한다. 10월 시험판은 일부 사람부터 써 본다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">0원</text>
            <text x="34" y="170" font-size="16" font-weight="800">기본 기능 이용료</text>
            <text class="grey" x="34" y="194" font-size="13.5">더 높은 기능은 회사마다 돈을 받을 수 있어요</text>

            <rect class="f-paper" x="34" y="230" width="320" height="52" rx="16"/>
            <text x="54" y="262" font-size="15" font-weight="800">SK텔레콤</text>
            <text class="grey" x="150" y="262" font-size="13.5">전화로 대신 예약</text>
            <rect class="f-paper" x="34" y="292" width="320" height="52" rx="16"/>
            <text x="54" y="324" font-size="15" font-weight="800">카카오</text>
            <text class="grey" x="150" y="324" font-size="13.5">카톡 안에서 예약·결제</text>
            <rect class="f-paper" x="34" y="354" width="320" height="52" rx="16"/>
            <text x="54" y="386" font-size="15" font-weight="800">KT</text>
            <text class="grey" x="150" y="386" font-size="13.5">검색과 비교를 한 번에</text>
            <text class="grey" x="34" y="440" font-size="12">정부가 돕는 국산 AI 사업이에요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <rect class="f-yellow" x="440" y="40" width="320" height="94" rx="16"/>
            <text x="600" y="80" font-size="22" font-weight="900" text-anchor="middle">10월</text>
            <text x="600" y="110" font-size="14" font-weight="700" text-anchor="middle">시험판(베타)을 열어요</text>
            <line class="line" x1="600" y1="140" x2="600" y2="160" stroke-width="3"/>
            <path class="f-ink" d="M600 170 l-8 -13 h16z"/>
            <rect class="f-paper" x="440" y="176" width="320" height="84" rx="16"/>
            <text x="600" y="212" font-size="18" font-weight="900" text-anchor="middle">12월</text>
            <text class="grey" x="600" y="238" font-size="13.5" text-anchor="middle">누구나 쓰는 정식 서비스</text>
            <line class="line" x1="600" y1="266" x2="600" y2="286" stroke-width="3"/>
            <path class="f-ink" d="M600 296 l-8 -13 h16z"/>
            <rect class="f-paper" x="440" y="302" width="320" height="84" rx="16"/>
            <text x="600" y="338" font-size="18" font-weight="900" text-anchor="middle">내년</text>
            <text class="grey" x="600" y="364" font-size="13.5" text-anchor="middle">한 사람에 AI 비서 하나가 목표</text>
            <text class="red" x="600" y="424" font-size="14" font-weight="800" text-anchor="middle">10월 시험판은 일부 사람부터 써 봐요</text>
          </svg>
