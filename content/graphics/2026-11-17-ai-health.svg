<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">애플 건강 AI 연구의 참가 인원, 참가 조건, 질문이 답이 되는 순서</title>
            <desc id="g1d">애플은 미국 시간 11월 15일 의료 AI 회사 오픈에비던스와 함께 '애플 건강 AI 사용 연구'를 시작했다. 최대 20만 명이 참여할 수 있다. 미국에 살고, 21살 이상이며, 애플 인텔리전스가 되는 아이폰을 가진 사람이 전용 앱으로 참여한다. 질문은 누구인지 알 수 없게 바꾼 뒤 AI에게 가고, AI는 의학 학술지를 근거로 답하며, 참가자는 답을 평가한다. 이 AI는 병을 진단하거나 치료하지 않는다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">20만 명</text>
            <text x="34" y="170" font-size="16" font-weight="800">참여할 수 있는 최대 인원</text>
            <text class="grey" x="34" y="194" font-size="13.5">애플 발표 · 미국 시간 11월 15일</text>
            <text x="34" y="240" font-size="15" font-weight="800">누가 참여할 수 있어요?</text>
            <rect class="f-paper" x="34" y="256" width="320" height="40" rx="14"/>
            <text x="194" y="282" font-size="14.5" font-weight="900" text-anchor="middle">미국에 사는 사람</text>
            <rect class="f-paper" x="34" y="306" width="320" height="40" rx="14"/>
            <text x="194" y="332" font-size="14.5" font-weight="900" text-anchor="middle">21살 이상</text>
            <rect class="f-paper" x="34" y="356" width="320" height="40" rx="14"/>
            <text x="194" y="382" font-size="14.5" font-weight="900" text-anchor="middle">AI가 되는 새 아이폰</text>
            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>
            <text x="440" y="56" font-size="15" font-weight="800">이렇게 답해요</text>
            <rect class="f-paper" x="440" y="74" width="320" height="44" rx="14"/>
            <text x="600" y="102" font-size="14.5" font-weight="900" text-anchor="middle">앱에서 건강을 물어요</text>
            <line class="line" x1="600" y1="122" x2="600" y2="134" stroke-width="3"/>
            <path class="f-ink" d="M592 134L608 134L600 144Z"/>
            <rect class="f-paper" x="440" y="150" width="320" height="44" rx="14"/>
            <text x="600" y="178" font-size="14.5" font-weight="900" text-anchor="middle">누구인지 모르게 바꿔요</text>
            <line class="line" x1="600" y1="198" x2="600" y2="210" stroke-width="3"/>
            <path class="f-ink" d="M592 210L608 210L600 220Z"/>
            <rect class="f-green" x="440" y="226" width="320" height="44" rx="14"/>
            <text x="600" y="254" font-size="14.5" font-weight="900" text-anchor="middle">학술지를 근거로 답해요</text>
            <line class="line" x1="600" y1="274" x2="600" y2="286" stroke-width="3"/>
            <path class="f-ink" d="M592 286L608 286L600 296Z"/>
            <rect class="f-paper" x="440" y="302" width="320" height="44" rx="14"/>
            <text x="600" y="330" font-size="14.5" font-weight="900" text-anchor="middle">답이 어땠는지 매겨요</text>
            <text class="red" x="440" y="384" font-size="14.5" font-weight="900">진단이나 치료는 하지 않아요</text>
            <text class="grey" x="440" y="410" font-size="13.5">함께하는 곳: 의료 AI 회사 오픈에비던스</text>
          </svg>
