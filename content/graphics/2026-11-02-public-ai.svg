<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g2t">국민AI서비스혁신추진단의 사람들</title>
            <desc id="g2d">과학기술정보통신부는 11월 1일 국민AI서비스혁신추진단장으로 김세웅 전 카카오 부사장을 뽑았다고 밝혔다. 단장은 11월 2일부터 2028년 9월 30일까지 일한다. 추진단은 모두 61명이다. 회사에서 온 개발자가 26명으로 43퍼센트이고, 공공 AI 실무자가 16명, 여러 부처 공무원이 13명, 관련 기관 전문가가 6명이다. 이번 달부터 개발자를 더 뽑는다. 막대 길이는 사람 수에 맞췄다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">61명</text>
            <text x="34" y="170" font-size="16" font-weight="800">정부 AI 서비스를 만드는 추진단</text>
            <text class="grey" x="34" y="194" font-size="13.5">과학기술정보통신부 · 11월 1일 발표</text>

            <text x="34" y="232" font-size="14" font-weight="800">회사에서 온 개발자 26명</text>
            <rect class="f-blue" x="34" y="240" width="260" height="22" rx="8"/>
            <text x="34" y="284" font-size="14" font-weight="800">공공 AI 실무자 16명</text>
            <rect class="f-paper" x="34" y="292" width="160" height="22" rx="8"/>
            <text x="34" y="336" font-size="14" font-weight="800">여러 부처 공무원 13명</text>
            <rect class="f-paper" x="34" y="344" width="130" height="22" rx="8"/>
            <text x="34" y="388" font-size="14" font-weight="800">관련 기관 전문가 6명</text>
            <rect class="f-paper" x="34" y="396" width="60" height="22" rx="8"/>
            <text class="grey" x="34" y="446" font-size="13.5">막대 길이는 사람 수에 맞췄어요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">새 단장은 이렇게 일해요</text>
            <rect class="f-paper" x="440" y="74" width="320" height="48" rx="16"/>
            <text x="600" y="104" font-size="14.5" font-weight="900" text-anchor="middle">카카오에서 AI를 만들던 사람</text>
            <line class="line" x1="600" y1="126" x2="600" y2="136" stroke-width="3"/>
            <path class="f-ink" d="M600 146 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="150" width="320" height="48" rx="16"/>
            <text x="600" y="180" font-size="14.5" font-weight="900" text-anchor="middle">11월 2일부터 일을 시작해요</text>
            <line class="line" x1="600" y1="202" x2="600" y2="212" stroke-width="3"/>
            <path class="f-ink" d="M600 222 l-8 -12 h16z"/>
            <rect class="f-blue" x="440" y="226" width="320" height="48" rx="16"/>
            <text class="white" x="600" y="256" font-size="14.5" font-weight="900" text-anchor="middle">2028년 9월 30일까지 맡아요</text>

            <text x="440" y="318" font-size="15" font-weight="800">추진단이 하려는 일</text>
            <text x="440" y="346" font-size="14.5" font-weight="700">밖에 맡기지 않고 직접 만들어요</text>
            <text x="440" y="370" font-size="14.5" font-weight="700">이번 달부터 개발자를 더 뽑아요</text>
            <text class="red" x="440" y="414" font-size="14.5" font-weight="900">어떤 서비스가 나올지는 아직 몰라요</text>
          </svg>
