<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g3t">AI 클로드가 설계한 전갈 독 단백질이 실험을 거쳐 남은 수와 약이 되기까지 남은 단계</title>
            <desc id="g3d">앤트로픽이 10월 20일(미국 시간) 발표한 연구다. 클로드는 64시간 동안 전갈 독 5가지에 달라붙을 단백질을 30만 개 넘게 설계했다. 그중 211개를 실험실에서 시험했고 17개가 독에 잘 달라붙었다. 전갈에 쏘이는 사람은 한 해 약 120만 명이고 해독제는 비싸거나 모자랄 때가 많다. 독에 붙는 것은 확인했지만 세포 실험과 동물 실험은 아직이다. 아직 해독제는 아니다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">17개</text>
            <text x="34" y="170" font-size="16" font-weight="800">독에 잘 달라붙은 단백질</text>
            <text class="grey" x="34" y="194" font-size="13.5">전갈 독 5가지를 겨눴어요</text>

            <rect class="f-paper" x="34" y="226" width="320" height="52" rx="16"/>
            <text x="194" y="258" font-size="14.5" font-weight="900" text-anchor="middle">64시간 동안 30만 개 넘게 설계</text>
            <line class="line" x1="194" y1="284" x2="194" y2="296" stroke-width="3"/>
            <path class="f-ink" d="M194 306 l-8 -12 h16z"/>
            <rect class="f-paper" x="34" y="310" width="320" height="52" rx="16"/>
            <text x="194" y="342" font-size="14.5" font-weight="900" text-anchor="middle">211개를 실험실에서 시험</text>
            <line class="line" x1="194" y1="368" x2="194" y2="380" stroke-width="3"/>
            <path class="f-ink" d="M194 390 l-8 -12 h16z"/>
            <rect class="f-green" x="34" y="394" width="320" height="52" rx="16"/>
            <text x="194" y="426" font-size="14.5" font-weight="900" text-anchor="middle">17개가 독에 달라붙었어요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">전갈에 쏘이는 사람</text>
            <rect class="f-green" x="440" y="74" width="320" height="52" rx="16"/>
            <text x="460" y="106" font-size="14.5" font-weight="900">한 해 약 120만 명</text>
            <text class="grey" x="440" y="150" font-size="12.5">해독제는 비싸거나</text>
            <text class="grey" x="440" y="172" font-size="12.5">모자랄 때가 많아요</text>

            <text x="440" y="216" font-size="15" font-weight="800">약이 되기까지</text>
            <rect class="f-paper" x="440" y="232" width="320" height="48" rx="16"/>
            <text x="460" y="262" font-size="14.5" font-weight="900">독에 붙는지 · 확인했어요</text>
            <rect class="f-paper" x="440" y="290" width="320" height="48" rx="16"/>
            <text x="460" y="320" font-size="14.5" font-weight="900">세포 실험 · 아직이에요</text>
            <rect class="f-paper" x="440" y="348" width="320" height="48" rx="16"/>
            <text x="460" y="378" font-size="14.5" font-weight="900">동물 실험 · 아직이에요</text>
            <text class="red" x="440" y="430" font-size="14.5" font-weight="900">아직 해독제는 아니에요</text>
          </svg>
