<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g2t">크롬의 제미나이 자동 완성이 메일에서 찾는 정보와 쓰는 순서</title>
            <desc id="g2d">구글이 10월 28일(미국 시간) 크롬의 새 자동 완성 기능을 내놓았다. 제미나이가 지메일 속 메일에서 주문 번호, 택배 운송장 번호, 비행기 예약 정보 3가지를 찾아 인터넷 입력 칸에 제안한다. 지금은 미국에서 18살이 넘은 개인 계정으로, 크롬의 제미나이와 개인 맞춤 기능을 켠 사람만 쓸 수 있다. 회사와 학교 계정은 빠진다. 원하지 않으면 크롬 설정에서 끌 수 있다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">3가지</text>
            <text x="34" y="170" font-size="16" font-weight="800">메일에서 찾아 채워 주는 정보</text>
            <text class="grey" x="34" y="194" font-size="13.5">구글 · 10월 28일 발표 (미국 시간)</text>

            <rect class="f-paper" x="34" y="222" width="320" height="48" rx="16"/>
            <text x="194" y="252" font-size="14.5" font-weight="900" text-anchor="middle">물건 주문 번호</text>
            <rect class="f-paper" x="34" y="280" width="320" height="48" rx="16"/>
            <text x="194" y="310" font-size="14.5" font-weight="900" text-anchor="middle">택배 운송장 번호</text>
            <rect class="f-blue" x="34" y="338" width="320" height="48" rx="16"/>
            <text class="white" x="194" y="368" font-size="14.5" font-weight="900" text-anchor="middle">비행기 예약 정보</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">이렇게 돼요</text>
            <rect class="f-paper" x="440" y="74" width="320" height="48" rx="16"/>
            <text x="600" y="104" font-size="14.5" font-weight="900" text-anchor="middle">지메일 속 메일</text>
            <line class="line" x1="600" y1="126" x2="600" y2="136" stroke-width="3"/>
            <path class="f-ink" d="M600 146 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="150" width="320" height="48" rx="16"/>
            <text x="600" y="180" font-size="14.5" font-weight="900" text-anchor="middle">제미나이가 찾아요</text>
            <line class="line" x1="600" y1="202" x2="600" y2="212" stroke-width="3"/>
            <path class="f-ink" d="M600 222 l-8 -12 h16z"/>
            <rect class="f-blue" x="440" y="226" width="320" height="48" rx="16"/>
            <text class="white" x="600" y="256" font-size="14.5" font-weight="900" text-anchor="middle">입력 칸에 제안해요</text>

            <text x="440" y="318" font-size="15" font-weight="800">지금 쓸 수 있는 사람</text>
            <text x="440" y="346" font-size="14.5" font-weight="700">미국, 18살 넘은 개인 계정</text>
            <text x="440" y="370" font-size="14.5" font-weight="700">개인 맞춤 기능을 켠 사람</text>
            <text class="red" x="440" y="414" font-size="14.5" font-weight="900">원하지 않으면 끌 수 있어요</text>
          </svg>
