<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g3t">음악 앱 디저에 올라오는 AI 노래 비율과 듣는 사람들의 생각</title>
            <desc id="g3d">음악 앱 디저에 새로 올라오는 노래 가운데 44%가 AI 곡으로, 하루 약 7만 5천 곡이다. 하지만 실제로 재생되는 노래 가운데 AI 곡은 1~3%에 그친다. 디저가 맡긴 조사에서 97%는 AI 노래와 사람 노래를 구별하지 못했고, 80%는 AI 노래에 표시를 해야 한다고 답했으며, 절반 넘게는 AI가 만들었는지 신경 쓴다고 했다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">44%</text>
            <text x="34" y="170" font-size="16" font-weight="800">새로 올라오는 노래 가운데 AI 곡</text>
            <text class="grey" x="34" y="194" font-size="13.5">음악 앱 디저, 하루 약 7만 5천 곡</text>

            <text class="grey" x="34" y="244" font-size="12.5">올라오는 노래 중 AI 곡</text>
            <rect class="f-pink" x="34" y="254" width="132" height="30" rx="10"/>
            <text x="176" y="276" font-size="14" font-weight="800">44%</text>
            <text class="grey" x="34" y="314" font-size="12.5">실제로 듣는 노래 중 AI 곡</text>
            <rect class="f-pink" x="34" y="324" width="9" height="30" rx="4"/>
            <text class="red" x="53" y="346" font-size="14" font-weight="800">1~3%</text>
            <text class="grey" x="34" y="442" font-size="12">디저가 올해 4월에 밝힌 숫자예요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">듣는 사람들의 생각</text>
            <rect class="f-paper" x="440" y="72" width="320" height="84" rx="16"/>
            <text x="600" y="108" font-size="22" font-weight="900" text-anchor="middle">97%</text>
            <text class="grey" x="600" y="136" font-size="13.5" text-anchor="middle">AI 노래와 사람 노래를 구별 못 했어요</text>
            <rect class="f-paper" x="440" y="166" width="320" height="84" rx="16"/>
            <text x="600" y="202" font-size="22" font-weight="900" text-anchor="middle">80%</text>
            <text class="grey" x="600" y="230" font-size="13.5" text-anchor="middle">AI 노래에는 표시를 해야 해요</text>
            <rect class="f-pink" x="440" y="260" width="320" height="84" rx="16"/>
            <text x="600" y="296" font-size="22" font-weight="900" text-anchor="middle">절반 넘게</text>
            <text x="600" y="324" font-size="13.5" text-anchor="middle">AI가 만들었는지 신경 쓴다고 했어요</text>
            <text class="grey" x="440" y="388" font-size="12">디저가 맡긴 조사예요</text>
          </svg>
