<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">챗GPT 지갑으로 AI 비서가 물건을 살 때 거치는 4단계와 쓸 수 있는 사람</title>
            <desc id="g1d">오픈AI는 11월 13일(미국 시각) 챗GPT 지갑을 내놓았다. AI 비서가 물건을 살 때는 네 단계를 거친다. 카드를 한 번 등록하고, 살 물건과 값과 카드를 화면에서 확인하고, 얼굴이나 지문으로 허락하면, 그 거래에만 쓰는 일회용 카드 번호로 결제된다. 가게도 AI도 진짜 카드 번호를 보지 못하고, 카드 혜택과 분쟁 보호는 그대로다. 지금은 미국에 사는 18세 이상 챗GPT 프로 구독자만 쓸 수 있고, 카드는 아메리칸익스프레스, 마스터카드, 비자다. 우리나라 일정은 알려지지 않았다.</desc>
            <text class="num" x="30" y="132" font-size="104" letter-spacing="-4">4단계</text>
            <text x="34" y="170" font-size="16" font-weight="800">AI가 대신 살 때 거치는 길</text>
            <text class="grey" x="34" y="194" font-size="13.5">오픈AI 발표 · 11월 13일 미국 시각</text>
            <text x="34" y="240" font-size="15" font-weight="800">누가 쓸 수 있나요?</text>
            <rect class="f-yellow" x="34" y="256" width="320" height="44" rx="14"/>
            <text x="194" y="284" font-size="14.5" font-weight="900" text-anchor="middle">미국의 18세 이상 프로 구독자</text>
            <rect class="f-paper" x="34" y="310" width="320" height="44" rx="14"/>
            <text x="194" y="338" font-size="14.5" font-weight="900" text-anchor="middle">미국에서 만든 카드 3종류</text>
            <text class="grey" x="34" y="380" font-size="13.5">아메리칸익스프레스 · 마스터카드 · 비자</text>
            <text class="red" x="34" y="412" font-size="14.5" font-weight="900">우리나라 일정은 아직 없어요</text>
            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>
            <text x="440" y="56" font-size="15" font-weight="800">이렇게 사요</text>
            <rect class="f-paper" x="440" y="74" width="320" height="44" rx="14"/>
            <text x="600" y="102" font-size="14.5" font-weight="900" text-anchor="middle">카드를 한 번만 등록해요</text>
            <line class="line" x1="600" y1="122" x2="600" y2="134" stroke-width="3"/>
            <path class="f-ink" d="M592 134L608 134L600 144Z"/>
            <rect class="f-paper" x="440" y="150" width="320" height="44" rx="14"/>
            <text x="600" y="178" font-size="14.5" font-weight="900" text-anchor="middle">살 물건·값·카드를 확인해요</text>
            <line class="line" x1="600" y1="198" x2="600" y2="210" stroke-width="3"/>
            <path class="f-ink" d="M592 210L608 210L600 220Z"/>
            <rect class="f-paper" x="440" y="226" width="320" height="44" rx="14"/>
            <text x="600" y="254" font-size="14.5" font-weight="900" text-anchor="middle">얼굴이나 지문으로 허락해요</text>
            <line class="line" x1="600" y1="274" x2="600" y2="286" stroke-width="3"/>
            <path class="f-ink" d="M592 286L608 286L600 296Z"/>
            <rect class="f-yellow" x="440" y="302" width="320" height="44" rx="14"/>
            <text x="600" y="330" font-size="14.5" font-weight="900" text-anchor="middle">일회용 번호로 결제돼요</text>
            <text x="440" y="384" font-size="14.5" font-weight="700">가게도 AI도 진짜 번호를 못 봐요</text>
            <text x="440" y="410" font-size="14.5" font-weight="700">카드 혜택과 분쟁 보호는 그대로예요</text>
          </svg>
