<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
<style>
text { font-family: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #000000; }
.num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
.grey { fill: #8A8A8A; }
.white { fill: #FFFFFF; }
.red { fill: #FF3D14; }
.f-red { fill: #FF3D14; }
.f-blue { fill: #1F3DFF; }
.f-yellow { fill: #FFD21F; }
.f-green { fill: #12A150; }
.f-pink { fill: #FF8FC8; }
.f-ink { fill: #000000; }
.f-paper { fill: #FFFFFF; }
.f-ground { fill: #DADADA; }
.line { stroke: #000000; }
.line-grey { stroke: #DADADA; }
.line-red { stroke: #FF3D14; }
</style>
<rect x="0" y="0" width="800" height="460" fill="#EDEEF0"/>
            <title id="g1t">구글 개인정보 약속에 생긴 예외와 메일 내용이 광고에 쓰일 수 있는 길</title>
            <desc id="g1d">구글은 2021년 7월부터 개인정보 처리방침에 지메일, 구글 포토, 드라이브의 내용으로 맞춤 광고를 하지 않는다고 적어 왔다. 10월 16일부터 적용된 새 처리방침에는, 사용자가 이 내용을 다른 서비스에 연결하면 예외라는 말이 붙었다. 메일과 사진을 개인 맞춤 AI 기능에 연결하면, 검색이 그 내용을 살펴 맞춤 광고를 고르는 데 쓸 수 있다. 연결은 사용자가 직접 켜야 생기고, 원하지 않으면 끊을 수 있다.</desc>
            <text class="num" x="30" y="132" font-size="110" letter-spacing="-4">5년</text>
            <text x="34" y="170" font-size="16" font-weight="800">지켜 온 약속에 예외가 생겼어요</text>
            <text class="grey" x="34" y="194" font-size="13.5">2021년 7월부터 처리방침에 적은 약속</text>

            <rect class="f-paper" x="34" y="226" width="320" height="84" rx="16"/>
            <text x="54" y="256" font-size="13.5" font-weight="800">전에는</text>
            <text x="54" y="284" font-size="14.5" font-weight="900">메일·사진 내용은 광고에 안 써요</text>
            <rect class="f-blue" x="34" y="322" width="320" height="84" rx="16"/>
            <text class="white" x="54" y="352" font-size="13.5" font-weight="800">10월 16일부터</text>
            <text class="white" x="54" y="380" font-size="14.5" font-weight="900">내가 연결하면 쓸 수 있어요</text>
            <text class="grey" x="34" y="436" font-size="12.5">광고주가 내 이름을 보지는 못한대요</text>

            <line class="line-grey" x1="400" y1="30" x2="400" y2="440" stroke-width="2"/>

            <text x="440" y="56" font-size="15" font-weight="800">메일이 광고에 닿는 길</text>
            <rect class="f-paper" x="440" y="74" width="320" height="46" rx="16"/>
            <text x="600" y="103" font-size="14.5" font-weight="900" text-anchor="middle">메일 · 사진 · 드라이브</text>
            <line class="line" x1="600" y1="124" x2="600" y2="132" stroke-width="3"/>
            <path class="f-ink" d="M600 142 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="146" width="320" height="46" rx="16"/>
            <text x="600" y="175" font-size="14.5" font-weight="900" text-anchor="middle">개인 맞춤 AI에 연결해요</text>
            <line class="line" x1="600" y1="196" x2="600" y2="204" stroke-width="3"/>
            <path class="f-ink" d="M600 214 l-8 -12 h16z"/>
            <rect class="f-paper" x="440" y="218" width="320" height="46" rx="16"/>
            <text x="600" y="247" font-size="14.5" font-weight="900" text-anchor="middle">검색이 그 내용을 살펴요</text>
            <line class="line" x1="600" y1="268" x2="600" y2="276" stroke-width="3"/>
            <path class="f-ink" d="M600 286 l-8 -12 h16z"/>
            <rect class="f-blue" x="440" y="290" width="320" height="46" rx="16"/>
            <text class="white" x="600" y="319" font-size="14.5" font-weight="900" text-anchor="middle">맞춤 광고를 골라요</text>
            <text class="grey" x="440" y="372" font-size="12.5">연결은 내가 직접 켜야 생겨요</text>
            <text class="red" x="440" y="408" font-size="14.5" font-weight="900">원하지 않으면 연결을 끊어요</text>
          </svg>
